[workspace]
[package]
name = "ai-platform-sdk-agent-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
anyhow = "1"
chrono = "0.4"
hex = "0.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
[dev-dependencies]
tempfile = "3"
[profile.dev]
debug = 0
incremental = false

[features]
# Offline composed integration only; absent from production builds.
integration-fixtures = []
