[package]
name = "ai-platform-migration-authority"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest.workspace = true
dotenvy = "0.15"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
pbkdf2 = "=0.12.2"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
regex = "1"
url = "2"
percent-encoding = "2"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid"] }

[[bin]]
name = "database-authority"
path = "src/main.rs"

[[bin]]
name = "check-successor-proposals"
path = "src/bin/check_successor_proposals.rs"

[[bin]]
name = "render-baseline-contract"
path = "src/bin/render_baseline_contract.rs"

[[bin]]
name = "freeze-baseline"
path = "src/bin/freeze_baseline.rs"

[[bin]]
name = "database-policy"
path = "src/bin/database_policy.rs"

[[bin]]
name = "generate-database-grants"
path = "src/bin/generate_database_grants.rs"

[[bin]]
name = "probe-successor-roles"
path = "src/bin/probe_successor_roles.rs"

[[bin]]
name = "repair-usage-metrics"
path = "src/bin/repair_usage_metrics.rs"

