[package]
name = "ai-platform-service-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2 = "0.10"
base64 = "0.22"
http-body = "1"
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto", "fernet_danger_timestamps"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic", "tls-roots"] }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
redis.workspace = true
rustls.workspace = true
reqwest.workspace = true
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
md-5 = "0.10"
quick-xml = "0.41"
unicode-normalization = "0.1"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
