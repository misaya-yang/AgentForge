[package]
name = "ai-platform-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
ai-platform-plugin-quiz = { version = "1.1.0", path = "../../../../agent-plugins/ai-quiz/native" }
ai-platform-plugin-quiz-gateway = { version = "1.1.0", path = "../../../../agent-plugins/ai-quiz/native/gateway" }
ai-platform-gateway-eval = { version = "0.1.0", path = "../platform-gateway-eval" }
tower = { version = "0.5", features = ["util"] }
ai-platform-capability-contract = { version = "0.0.0", path = "../../../agent-runtime-overlay/kernel-rs/ai-platform-capability-contract" }
ed25519-dalek.workspace = true
ai-platform-rpc = { version = "0.1.0", path = "../platform-rpc"  }
ai-platform-service-primitives = { version = "0.1.0", path = "../platform-service-primitives"  }
tracing = "0.1"
ai-platform-migration-authority = { version = "0.1.0", path = "../platform-migration-authority"  }
url = "2"
ai-platform-config-loader = { version = "0.1.0", path = "../platform-config-loader"  }
ai-platform-gateway-foundation = { version = "0.1.0", path = "../platform-gateway-foundation"  }
ai-platform-auth = { version = "0.1.0", path = "../platform-auth"  }
axum = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest.workspace = true
tokio.workspace = true
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
redis.workspace = true
jsonschema = { version = "=0.33.0", default-features = false }
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite.workspace = true
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto", "fernet_danger_timestamps"] }
base64 = "0.22"
ring = "=0.17.14"
rustls.workspace = true
tokio-rustls.workspace = true
dotenvy = "0.15"
# Canonical migration parsers, local SQLite ledger, and host middleware.
regex = "1"
syn = { version = "2", features = ["full"] }
jsonwebtoken = "9.3"
encoding_rs = "0.8"
zip.workspace = true
quick-xml = "0.41"
scraper.workspace = true
tiktoken-rs = "0.7"
serde_yaml.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
unicode-normalization = "0.1"
http-body = "1"

# Source-compatible OSS signing and local file metadata digests.
sha1 = "0.10"
md-5 = "0.10"
unicode-casefold = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

ai-platform-gateway-integrations = { version = "0.1.0", path = "../platform-gateway-integrations"  }

[dev-dependencies]
