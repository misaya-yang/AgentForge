[package]
name = "ai-platform-gateway-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
ai-platform-auth = { version = "0.1.0", path = "../platform-auth" }
ai-platform-gateway-foundation = { version = "0.1.0", path = "../platform-gateway-foundation" }
ai-platform-gateway-integrations = { version = "0.1.0", path = "../platform-gateway-integrations" }
ai-platform-service-primitives = { version = "0.1.0", path = "../platform-service-primitives" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive"] }
