<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Approve AgentForge CLI</title><style>body{font:18px system-ui;max-width:38rem;margin:10vh auto;padding:1.5rem;color:#182338}input,button{font:inherit;padding:.6rem;margin:.4rem}button{cursor:pointer}#status{white-space:pre-line}section{padding:1rem;border:1px solid #ccd3df;border-radius:.5rem}</style></head><body><h1>Connect AgentForge CLI</h1><p>Only approve a code displayed by a CLI that you started. Approval gives it your current platform permissions until your browser session expires. Sign in to AgentForge first.</p><label>Device code <input id="code" maxlength="11" autocomplete="off" spellcheck="false"></label><button id="review">Review</button><section id="confirmation" hidden><p id="details"></p><button id="approve">Approve</button><button id="deny">Deny</button></section><p id="status" role="status"></p><script>
'use strict';
const code=document.getElementById('code'),status=document.getElementById('status'),confirmation=document.getElementById('confirmation');
let csrf='',reviewed='';
code.value=new URLSearchParams(location.search).get('user_code')||'';
history.replaceState(null,'',location.pathname);
async function request(url,options){const response=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(response.status===401?'Sign in to AgentForge in another tab, then review this code again.':body.error==='step_up_required'?'Verify your passkey in Console Settings, then review and approve this code again.':body.error||body.detail||'Request failed.');return body;}
code.addEventListener('input',()=>{confirmation.hidden=true;reviewed='';});
document.getElementById('review').addEventListener('click',async()=>{confirmation.hidden=true;status.textContent='';try{const session=await request('/api/auth/session');csrf=session.csrf_token;const details=await request('/api/auth/device/request?user_code='+encodeURIComponent(code.value));reviewed=code.value;document.getElementById('details').textContent='Client: '+details.client_id+'\nUser: '+details.user_id+'\nTenant: '+details.tenant_id+'\nScope: '+details.scope;confirmation.hidden=false;}catch(error){status.textContent=error.message;}});
async function decide(approve){if(!reviewed)return;confirmation.hidden=true;const chosen=reviewed;reviewed='';try{await request('/api/auth/device',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({user_code:chosen,approve})});status.textContent=approve?'Approved. Return to your CLI.':'Denied.';}catch(error){status.textContent=error.message;}}
document.getElementById('approve').addEventListener('click',()=>decide(true));
document.getElementById('deny').addEventListener('click',()=>decide(false));
</script></body></html>
