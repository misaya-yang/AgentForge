[package]
name = "ai-platform-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
ai-platform-service-primitives = { path = "../platform-service-primitives" }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
bcrypt = "0.17"
jsonwebtoken = "9.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
tokio.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive"] }
chrono = { version = "0.4", features = ["serde"] }
redis.workspace = true
axum = "0.8"
sha2 = "0.10"

[[bin]]
name = "admin-create"
path = "src/bin/admin_create.rs"
