[package]
name = "ai-platform-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
ai-platform-service-primitives = { version = "0.1.0", path = "../platform-service-primitives"  }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
bcrypt = "0.17"
argon2.workspace = true
base64 = "0.22"
ed25519-dalek.workspace = true
jsonwebtoken = "9.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
tokio.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive"] }
chrono = { version = "0.4", features = ["serde"] }
redis.workspace = true
axum.workspace = true
reqwest.workspace = true
openidconnect.workspace = true
webauthn-rs.workspace = true
sha2 = "0.10"

[[bin]]
name = "admin-create"
path = "src/bin/admin_create.rs"
