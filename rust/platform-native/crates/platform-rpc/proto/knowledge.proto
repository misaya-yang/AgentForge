syntax = "proto3";
package platform.knowledge.v1;
// Internal RPC only. Existing external HTTP representations remain unchanged.
service KnowledgeRetrieval {
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}
message RetrieveRequest {
  string dataset_id = 1;
  // Exact signed JSON is retained for the existing v2 HMAC body digest and all
  // advanced retrieval options. Typed fields MUST agree with this body.
  bytes request_json = 2;
  string query = 3;
  optional uint64 top_k = 4;
  optional string mode = 5;
  optional string document_id = 6;
  optional string language_filter = 7;
  optional string source_type_filter = 8;
  optional bytes metadata_filter_json = 9;
}
message RetrievalHit {
  string segment_id = 1;
  string document_id = 2;
  double score = 3;
  string text = 4;
  bytes metadata_json = 5;
  string content_type = 6;
  optional string image_url = 7;
  optional string vlm_description = 8;
  repeated bytes associated_images_json = 9;
}
message RetrieveResponse {
  uint32 status_code = 1;
  // Byte-exact HTTP result preserves errors and forward-compatible fields.
  bytes response_json = 2;
  repeated RetrievalHit hits = 3;
  optional string retry_after = 4;
}
