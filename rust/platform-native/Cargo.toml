[workspace]
members = ["crates/platform-rpc", "crates/platform-client-packaging", "crates/platform-knowledge-ops", "crates/platform-agent-plugins", "crates/platform-release", "crates/platform-eval", "crates/platform-tools", "crates/platform-config-loader", "crates/platform-knowledge-service", "crates/platform-local-node", "crates/platform-sdk-agent-worker", "crates/platform-migration-authority", "crates/platform-openapi", "crates/platform-client", "crates/platform-desktop", "crates/platform-auth", "crates/platform-gateway", "crates/platform-gateway-foundation", "crates/platform-gateway-integrations"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[workspace.dependencies]
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
redis = { version = "=1.7.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "signal", "io-util", "fs", "process"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "query", "form"] }
[profile.dev]
debug = 0
incremental = false
