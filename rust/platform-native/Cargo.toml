[workspace]
members = ["crates/platform-rpc", "crates/platform-client-packaging", "crates/platform-knowledge-ops", "crates/platform-agent-plugins", "crates/platform-release", "crates/platform-eval", "crates/platform-tools", "crates/platform-config-loader", "crates/platform-knowledge-service", "crates/platform-knowledge-domain", "crates/platform-service-primitives", "crates/platform-local-node", "crates/platform-sdk-agent-worker", "crates/platform-migration-authority", "crates/platform-openapi", "crates/platform-client", "crates/platform-desktop", "crates/platform-auth", "crates/platform-gateway", "crates/platform-gateway-foundation", "crates/platform-gateway-integrations"]
resolver = "2"
exclude = ["vendor/candle-core-0.11.0", "vendor/gemm-0.19.0", "vendor/gemm-common-0.19.0", "vendor/gemm-c32-0.19.0", "vendor/gemm-c64-0.19.0", "vendor/gemm-f16-0.19.0", "vendor/gemm-f32-0.19.0", "vendor/gemm-f64-0.19.0", "vendor/pulp-0.22.3", "vendor/tokenizers-0.22.2", "vendor/openidconnect-4.0.1"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[workspace.dependencies]
scraper = "=0.27.0"
ego-tree = "=0.11.0"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem"] }
argon2 = { version = "=0.5.3", features = ["std"] }
unsafe-libyaml = { package = "unsafe-libyaml-norway", version = "=0.2.15" }
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
sqlx = { version = "0.8", default-features = false }
axum = "0.8"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
redis = { version = "=1.7.1", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
serde_yaml = { package = "serde_norway", version = "=0.9.42" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "signal", "io-util", "fs", "process"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "query", "form"] }
openidconnect = { version = "=4.0.1", default-features = false }
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
[profile.dev]
debug = 0
incremental = false

[patch.crates-io]
candle-core = { path = "vendor/candle-core-0.11.0" }

gemm = { path = "vendor/gemm-0.19.0" }

gemm-common = { path = "vendor/gemm-common-0.19.0" }

gemm-c32 = { path = "vendor/gemm-c32-0.19.0" }

gemm-c64 = { path = "vendor/gemm-c64-0.19.0" }

gemm-f16 = { path = "vendor/gemm-f16-0.19.0" }

gemm-f32 = { path = "vendor/gemm-f32-0.19.0" }

gemm-f64 = { path = "vendor/gemm-f64-0.19.0" }

pulp = { path = "vendor/pulp-0.22.3" }

tokenizers = { path = "vendor/tokenizers-0.22.2" }

openidconnect = { path = "vendor/openidconnect-4.0.1" }
