      summary: AgentTurn candidate latency budget burning (5m/1h)
  - alert: AgentTurnBudgetBurnSlow
    expr: (agentforge:agent_turn_slow_ratio:30m > 0.06) and (agentforge:agent_turn_slow_ratio:6h > 0.06)
