# Prometheus Alert Rules for AI Gateway

groups:
  - name: gateway_alerts
    interval: 30s
    rules:
      # High Error Rate Alert
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(gateway_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(gateway_requests_total[5m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | printf \"%.1f\" }}% (threshold: 5%)"

      - alert: CriticalErrorRate
        expr: |
          (
            sum(rate(gateway_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(gateway_requests_total[5m]))
          ) * 100 > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate detected"
          description: "Error rate is {{ $value | printf \"%.1f\" }}% (threshold: 10%)"

      # High Latency Alert
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(gateway_request_duration_ms_bucket[5m])) by (le)) > 2000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency detected"
          description: "P95 latency is {{ $value | printf \"%.0f\" }}ms (threshold: 2000ms)"

      - alert: CriticalLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(gateway_request_duration_ms_bucket[5m])) by (le)) > 5000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical P95 latency detected"
          description: "P95 latency is {{ $value | printf \"%.0f\" }}ms (threshold: 5000ms)"

      # Gateway Down Alert
      - alert: GatewayDown
        expr: up{job="ai-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI Gateway is down"
          description: "AI Gateway has been unreachable for more than 1 minute"

      # Low Request Throughput (potential issue)
      - alert: LowThroughput
        expr: |
          sum(rate(gateway_requests_total[5m])) < 0.1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low request throughput"
          description: "Request rate is {{ $value | printf \"%.2f\" }} req/s"

  - name: infrastructure_alerts
    interval: 30s
    rules:
      # Redis Connection Issues
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for more than 1 minute"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (
            node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
          ) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}%"

  - name: event_bus_alerts
    interval: 30s
    rules:
      - alert: HighDLQDepth
        expr: event_dlq_depth > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High event DLQ depth"
          description: "Event DLQ depth is {{ $value | printf \"%.0f\" }} (threshold: 100)"

      - alert: CriticalDLQDepth
        expr: event_dlq_depth > 1000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical event DLQ depth"
          description: "Event DLQ depth is {{ $value | printf \"%.0f\" }} (threshold: 1000)"

      - alert: EventConsumerLag
        expr: event_consumer_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event consumer lag is high"
          description: "Consumer lag is {{ $value | printf \"%.0f\" }} messages"

  - name: langgraph_alerts
    interval: 30s
    rules:
      # Low LangGraph Run Success Rate
      - alert: LowRunSuccessRate
        expr: |
          (
            sum(rate(langgraph_runs_success_total[5m]))
            /
            sum(rate(langgraph_runs_total[5m]))
          ) * 100 < 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low LangGraph run success rate"
          description: "Success rate is {{ $value | printf \"%.1f\" }}% (threshold: 90%)"

      # High Token Consumption (cost alert)
      - alert: HighTokenConsumption
        expr: |
          sum(increase(langgraph_token_usage_total[1h])) > 1000000
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "High token consumption"
          description: "{{ $value | printf \"%.0f\" }} tokens consumed in the last hour"
