  - alert: AgentTurnTelemetryAbsent
    expr: absent(sum(gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="invoke_agent"})) or absent(sum(gen_ai_client_operation_duration_seconds_bucket{gen_ai_operation_name="invoke_agent",le="50"}))
    for: 10m
