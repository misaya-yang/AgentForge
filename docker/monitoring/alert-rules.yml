      0.000001), 0)) * (sum(rate(gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="invoke_agent"}[6h]))
      > bool 0)
  - alert: AgentTurnBudgetBurnFast
    expr: (agentforge:agent_turn_slow_ratio:5m > 0.144) and (agentforge:agent_turn_slow_ratio:1h > 0.144)
    for: 2m
    labels:
      severity: warning
      owner: runtime
