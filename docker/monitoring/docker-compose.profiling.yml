services:
  pyroscope:
    image: grafana/pyroscope:2.4.0@sha256:b7e62699a27463aa3533efe3f88c320da594da495731fd6eabca6f44f92cdd7b
    profiles:
    - profiling
    command:
    - server
    - -analytics.opt-out=true
    mem_limit: 128m
    cpus: 0.25
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - app
    volumes:
    - monitoring-pyroscope:/data
volumes:
  monitoring-pyroscope: {}
