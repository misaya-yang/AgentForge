global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
- /etc/prometheus/alert-rules.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: gateway
  metrics_path: /metrics
  authorization:
    type: Bearer
    credentials_file: /run/secrets/metrics-token
  static_configs:
  - targets:
    - gateway:8080
- job_name: otlp
  static_configs:
  - targets:
    - otel-collector:8889
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
