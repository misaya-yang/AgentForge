# Merge AFTER root docker-compose.yml; Compose >= 2.24.4 required. Opt in only.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
    profiles:
    - observability
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - app
    volumes:
    - ./docker/monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles:
    - observability
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - app
    volumes:
    - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./docker/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    - monitoring-prometheus:/prometheus
    - ${MONITORING_METRICS_TOKEN_FILE:?set metrics-read bearer credential file}:/run/secrets/metrics-token:ro
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=24h
    - --storage.tsdb.retention.size=512MB
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles:
    - observability
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - app
    volumes:
    - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - monitoring-grafana:/var/lib/grafana
    - ${MONITORING_GRAFANA_PASSWORD_FILE:?set Grafana admin password file}:/run/secrets/grafana-admin:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
    - 127.0.0.1:${MONITORING_GRAFANA_PORT:-3001}:3000
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    profiles:
    - observability
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - app
    volumes:
    - ./docker/monitoring/loki.yaml:/etc/loki/config.yaml:ro
    - monitoring-loki:/loki
    command:
    - -config.file=/etc/loki/config.yaml
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles:
    - observability
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - app
    volumes:
    - ./docker/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - monitoring-alertmanager:/alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
  tempo:
    image: grafana/tempo:2.7.2@sha256:4b0277a9b572a4b1fa43b01468e58911ec214dd69d033f2cd476596d14de9fe3
    profiles:
    - observability
    mem_limit: 256m
    cpus: 0.5
    ports: !reset []
    volumes:
    - ./docker/monitoring/tempo.yaml:/etc/tempo.yaml:ro
    - tempo-data:/var/tempo
  gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  knowledge-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  knowledge-worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  agent-runtime:
    environment:
      AI_PLATFORM_OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  agent-capability-worker:
    environment:
      AI_PLATFORM_OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
volumes:
  monitoring-prometheus: {}
  monitoring-grafana: {}
  monitoring-loki: {}
  monitoring-alertmanager: {}
