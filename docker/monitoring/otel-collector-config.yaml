receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  transform/privacy:
    error_mode: propagate
    trace_statements:
    - context: span
      statements:
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "deployment.environment.name", "gen_ai.semconv.version"])
      - keep_keys(attributes, ["http.request.method", "http.response.status_code",
        "http.route", "rpc.system", "rpc.service", "rpc.method", "error.type", "gen_ai.operation.name",
        "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens",
        "gen_ai.usage.output_tokens", "agentforge.tenant.id", "gen_ai.token.type", "outcome"])
      - set(name, "operation") where attributes["gen_ai.operation.name"] == nil
      - set(name, attributes["gen_ai.operation.name"]) where attributes["gen_ai.operation.name"] != nil
      - set(status.message, "")
    log_statements:
    - context: log
      statements:
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "deployment.environment.name", "gen_ai.semconv.version"])
      - keep_keys(attributes, ["http.request.method", "http.response.status_code",
        "http.route", "rpc.system", "rpc.service", "rpc.method", "error.type", "gen_ai.operation.name",
        "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens",
        "gen_ai.usage.output_tokens", "agentforge.tenant.id", "gen_ai.token.type", "outcome"])
      - set(body, "[redacted]")
    metric_statements:
    - context: datapoint
      statements:
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "deployment.environment.name", "gen_ai.semconv.version"])
      - keep_keys(attributes, ["http.request.method", "http.response.status_code",
        "http.route", "rpc.system", "rpc.service", "rpc.method", "error.type", "gen_ai.operation.name",
        "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens",
        "gen_ai.usage.output_tokens", "agentforge.tenant.id", "gen_ai.token.type", "outcome"])
  tail_sampling:
    decision_wait: 10s
    num_traces: 2000
    expected_new_traces_per_sec: 100
    policies:
    - name: errors
      type: status_code
      status_code:
        status_codes:
        - ERROR
    - name: slow
      type: latency
      latency:
        threshold_ms: 2000
    - name: baseline
      type: probabilistic
      probabilistic:
        sampling_percentage: 10
  batch:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 512
  filter/private-events:
    error_mode: propagate
    traces:
      spanevent:
      - 'true'
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 64
    retry_on_failure:
      max_elapsed_time: 30s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: false
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions:
  - health_check
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/privacy
      - filter/private-events
      - tail_sampling
      - batch
      exporters:
      - otlp/tempo
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/privacy
      - batch
      exporters:
      - prometheus
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/privacy
      - batch
      exporters:
      - otlphttp/loki
