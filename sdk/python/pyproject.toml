[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway-sdk"
version = "1.0.1"
description = "Python SDK for the AI Gateway assistant API — chat, streaming, knowledge base, image generation, artifacts, and session management."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AI Gateway Maintainers" },
]
keywords = ["ai", "assistant", "sdk", "gateway", "streaming", "sse"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/misaya-yang/AI--Platfform"
Documentation = "https://github.com/misaya-yang/AI--Platfform/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["ai_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
