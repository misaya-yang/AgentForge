[package]
name = "ai-platform-plugin-quiz-gateway"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
ai-platform-plugin-quiz = { version = "1.1.0", path = ".." }
ai-platform-gateway-foundation = { version = "0.1.0", path = "../../../../rust/platform-native/crates/platform-gateway-foundation" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8", features = ["json","query"] }
reqwest = { version = "0.13", default-features = false }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls","postgres","chrono","json","uuid"] }
tokio = { version = "1", features = ["sync","time"] }
uuid = { version = "1", features = ["v4","serde"] }
[dev-dependencies]
tokio = { version = "1", features = ["macros","rt-multi-thread"] }
