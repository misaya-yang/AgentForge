    triggers: ["tests/fixtures/eval/rag/golden/**", "scripts/seed_kb_golden_set.py", "scripts/regen_rag_observations.py", "scripts/import_kb_eval_golden.py", "tests/scripts/test_kb_golden_set.py", "tests/scripts/test_regen_rag_observations.py", "tests/scripts/test_import_kb_eval_golden.py"]
    tier: L1
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 15
    evidence: tmp/gate-evidence/kb-golden-gate.log
    ci_job: eval-regression-gate
  kb_release_evidence:
    make: kb-release-evidence-gate
    purpose: Fail-closed T0 release evidence; distinct from the development golden fixture gate.
    triggers: ["tests/fixtures/eval/rag/golden/**", "reports/kb-eval-baseline/**", "scripts/harness/kb_release_evidence_gate.py", "tests/harness/test_kb_release_evidence_gate.py"]
    tier: L1
    required_on: [release, manual]
    resource: offline
    skip: never
    timeout: 10
    evidence: reports/kb-eval-baseline/release-pointer.json
    ci_job: manual
  rag_fixture:
    make: rag-eval-fixture-contract
    purpose: L1 offline fixture replay — no provider, no live stack.
    triggers: ["scripts/eval_rag.py", "tests/fixtures/eval/rag/**"]
    tier: L1
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 15
    evidence: tmp/eval-e1/rag-latest.json
    ci_job: eval-regression-gate
  rag_live_quality:
    make: rag-live-quality-gate
    purpose: L3 live quality gate — golden set replayed against the running Knowledge Service.
    triggers: ["scripts/regen_rag_observations.py", "tests/fixtures/eval/rag/golden/**"]
    tier: L3
    required_on: [release, manual]
    resource: live-stack
    skip: live-stack
    timeout: 45
    evidence: reports/rag-live-quality/latest.json
    ci_job: manual
  agent_studio:
    make: verify-agent-studio
    triggers: ["web/src/pages/agents/**", "src/api/v1/agents.py", "src/api/v1/agent_runtime.py"]
    tier: L2
    required_on: [release, manual]
    resource: live-stack
    skip: live-stack
    timeout: 60
    evidence: reports/agent-studio/agent-studio-regression-v1-result.json
    ci_job: manual
  deployment:
    make: validate-example-config
    triggers: ["docker-compose*", ".env.example", "scripts/new/**", Dockerfile, ".dockerignore", "deploy/**", "docker/**", "config/**", "data/**", "examples/**"]
    tier: L1
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 10
    evidence: tmp/gate-evidence/validate-example-config.log
    ci_job: compose-and-harness
  frontend:
    shell: "pnpm -C web type-check && pnpm -C web lint && pnpm -C web test && pnpm -C web build"
    triggers: ["web/**"]
    tier: L1
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 30
    evidence: tmp/gate-evidence/frontend/*.log
    ci_job: frontend
  web_quality:
    shell: "pnpm -C web type-check && pnpm -C web lint && pnpm -C web test && pnpm -C web i18n:check"
    purpose: Web gate without the production build — type-check, lint, node units, i18n.
    triggers: ["web/**"]
    tier: L1
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 20
    evidence: tmp/gate-evidence/frontend/*.log
    ci_job: frontend
  rust_changed_crate:
    make: rust-changed-crate-gate
    purpose: In hosted CI, compose the lock-pinned upstream Git object with the current overlay, then test only changed Rust crates with the exact locked toolchain.
    triggers: ["rust/**", deploy/agent-runtime-source/lock.json, scripts/harness/rust_changed_crate_gate.py, tests/harness/test_rust_changed_crate_gate.py, tests/scripts/test_rust_build_tooling.py]
    tier: L1
    required_on: [change, release]
    resource: hosted-service
    skip: never
    timeout: 60
    evidence: tmp/gate-evidence/rust-changed-crate-gate.json
    ci_job: rust-changed-crate
  sdk_sse:
    make: sdk-sse-contract
    triggers: ["sdk/**", "tests/contract/test_sdk_sse_fixture_contract.py"]
    tier: L1
    required_on: [change, release]
    resource: offline
    skip: toolchain
    timeout: 30
    evidence: tmp/gate-evidence/sdk-sse-contract.log
    ci_job: sdk-sse
  independent_cli:
    make: independent-cli-gate
    triggers: ["sdk/cli/**", "deploy/agent-runtime-source/Dockerfile.cli", "scripts/harness/build_agent_runtime_cli_package.sh"]
    tier: L1
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 15
    evidence: tmp/gate-evidence/independent-cli-gate.log
    ci_job: independent-cli
  hygiene:
    make: hygiene-check
    purpose: Empty/self-proving tests, .only/.fixme scan (negative self-test included).
    triggers: ["tests/**", "web/src/**", "web/e2e/**", "sdk/**", scripts/harness/hygiene_check.py, "scripts/evidence/**", "deploy/evidence/**", "deploy/repository-quality/**"]
    tier: L0
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 5
    evidence: tmp/gate-evidence/hygiene-check.json
    ci_job: architecture-gates
  compatibility_manifest:
    make: compatibility-manifest-gate
    purpose: Bind Git/images/runtime overlay/DB/contracts/topology/toolchains/vector revisions and service version reports into one release unit.
    triggers: ["deploy/release/**", "scripts/release/**", packages/ai-gateway-core/src/ai_gateway_core/release_manifest.py, src/api/version.py, apps/knowledge-service/src/knowledge_service/api/version.py]
    tier: L0
    required_on: [release, manual]
    resource: offline
    skip: never
    timeout: 5
    evidence: deploy/release/compatibility-manifest.json
    ci_job: manual
  platform_integration:
    make: platform-release-gate
    purpose: Execute actual DB, Agent Execution, Knowledge, fresh-install and rollback gates with zero unexpected skips.
    triggers: [deploy/release/integration-gates.json, scripts/release/integration_gates.py]
    tier: L3
    required_on: [release, manual]
    resource: live-stack
    skip: never
    timeout: 180
    evidence: tmp/gate-evidence/all-integration.json
    ci_job: manual
  loc_no_growth:
    make: loc-no-growth-gate
    purpose: Oversized files never grow; new files stay under threshold; bound to the checked-in ledger.
    triggers: ["src/**", "apps/**", "packages/**", "web/src/**", "scripts/**", "tests/**", scripts/harness/loc_no_growth_gate.py]
    tier: L0
    required_on: [change, release]
    resource: offline
    skip: never
    timeout: 5
    evidence: tmp/gate-evidence/loc-no-growth.json
    ci_job: architecture-gates

# -- Workspace hygiene --------------------------------------------------------
# Agents drop test files and screenshots wherever they happen to be standing.
# These rules are enforced by `make harness-check`, so the tree stays predictable
# no matter which machine or which agent produced the change.
workspace:
  # Playwright / Vitest specs may only live under these roots.
  spec_roots: [web/e2e, web/src, sdk]
  spec_globs: ["*.spec.ts", "*.spec.tsx", "*.test.ts", "*.test.tsx"]
  # Playwright configs are a web/ concern; nowhere else.
  playwright_config_root: web
  # Nothing matching these may sit at the repository root.
  root_forbidden: ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.har", "*.zip", "*.spec.ts", "*.test.ts", "test_*.py", "check_*.py", "*_debug.py"]
  # Where run artifacts belong. All are ignored by git; never commit them.
  artifacts:
    e2e_specs: web/e2e
    e2e_helpers: web/e2e/support
    e2e_fixtures: web/e2e/fixtures
    e2e_run_output: web/test-results
    e2e_html_report: web/playwright-report
    e2e_auth_state: web/.playwright
    browser_scratch: tmp/browser
    agent_scratch: tmp

# -- Task loop ----------------------------------------------------------------
loop:
  stages: [observe, act, verify, decide]
  rules:
    - One feature per cycle.
    - A change is unverified until its gate has run; never merge act and verify into a claim.
    - Evidence means a named command and its real output.
    - Status for multi-phase or context-spanning programs lives in loop-state.json, not in prose.

# -- Multi-session programs ---------------------------------------------------
programs:
  root: deploy/runbooks
  state_file: loop-state.json
  # Required files depend on the program's own loop-state schema_version. v4 is the
  # minimal contract and deliberately dropped v3's plan/report/ledger artifacts, so
  # asserting v4 on a v3 program produces noise, not signal.
  required_files_by_schema:
    prd-phase-harness/loop-state/v4: [README.md, loop-state.json, HANDOFF.md, init.sh]
    prd-phase-harness/loop-state/v3: [README.md, loop-state.json, agent-handoff.md, progress-log.md]
    prd-phase-harness/loop-state/v2: [README.md, loop-state.json, agent-handoff.md, progress-log.md]
    prd-phase-harness/loop-state/v1: [README.md, loop-state.json, agent-handoff.md, progress-log.md]
  structural_validator: "python3 scripts/harness/check_harness.py"
  semantic_validator_target: "make program-check PROGRAM=<program-dir>  # queued for ARC-00"
  convention: docs/harness/workflow.md#4-programs-and-large-changes

# -- Knowledge locations ------------------------------------------------------
knowledge:
  design_and_plans: docs/
  architecture_decisions: docs/architecture/
  programs: deploy/runbooks/
  evidence_and_reports: reports/
  archive: docs/archive/
