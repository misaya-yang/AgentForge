    ci_job: agent-runtime-contracts
  agent_runtime_readonly:
    make: agent-runtime-readonly-gate
    triggers: ["rust/platform-native/crates/platform-gateway/src/migration_agent/readonly*.rs", "rust/platform-native/crates/platform-gateway/tests/readonly_contributor_gate.rs", "rust/platform-native/crates/platform-tools/src/native_gates.rs"]
