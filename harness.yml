    triggers: ["database/migrations/089*", "database/migrations/090*", "database/migrations/092*", "database/migrations/093*", "database/migrations/094*", "database/migrations/095*", "rust/platform-native/crates/platform-migration-authority/tests/runtime_thread_store_migration.rs", "scripts/harness/agent_thread_store_contract.sh"]
