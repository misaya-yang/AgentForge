# -- Workspace hygiene --------------------------------------------------------
# Agents drop test files and screenshots wherever they happen to be standing.
# These rules are enforced by `make harness-check`, so the tree stays predictable
# no matter which machine or which agent produced the change.
workspace:
  # Playwright / Vitest specs may only live under these roots.
  spec_roots: [web/e2e, web/src, sdk]
  spec_globs: ["*.spec.ts", "*.spec.tsx", "*.test.ts", "*.test.tsx"]
  # Playwright configs are a web/ concern; nowhere else.
  playwright_config_root: web
  # Nothing matching these may sit at the repository root.
  root_forbidden: ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.har", "*.zip", "*.spec.ts", "*.test.ts", "test_*.py", "check_*.py", "*_debug.py"]
  # Where run artifacts belong. All are ignored by git; never commit them.
  artifacts:
    e2e_specs: web/e2e
    e2e_helpers: web/e2e/support
    e2e_fixtures: web/e2e/fixtures
    e2e_run_output: web/test-results
    e2e_html_report: web/playwright-report
    e2e_auth_state: web/.playwright
    browser_scratch: tmp/browser
    agent_scratch: tmp

# -- Task loop ----------------------------------------------------------------
loop:
  guide: docs/harness/README.md
  stages: [scope, implement, integrate, verify, deliver]
  rules:
    - Complete a module or integrated batch before verification; do not cycle per function or file.
    - Select checks by required behavior, deduplicate overlapping coverage, and assign one executor.
    - Reuse applicable results across agents; rerun only for relevant changes or new failure evidence.
    - Fix the cause before repeating a failed command; continue independent work if its environment is unavailable.
    - Report actual outcomes and unrun requirements without adding reports or changing acceptance standards.
    - End the task when its requested outcome and applicable verification are complete; do not create housekeeping work.

# -- Multi-session programs ---------------------------------------------------
programs:
  root: deploy/runbooks
  state_file: loop-state.json
  # Required files depend on the program's own loop-state schema_version. v4 is the
  # minimal contract and deliberately dropped v3's plan/report/ledger artifacts, so
  # asserting v4 on a v3 program produces noise, not signal.
  required_files_by_schema:
    prd-phase-harness/loop-state/v4: [README.md, loop-state.json]
    prd-phase-harness/loop-state/v3: [README.md, loop-state.json, agent-handoff.md, progress-log.md]
    prd-phase-harness/loop-state/v2: [README.md, loop-state.json, agent-handoff.md, progress-log.md]
    prd-phase-harness/loop-state/v1: [README.md, loop-state.json, agent-handoff.md, progress-log.md]
  structural_validator: "platform-tools harness-check --repo-root ."
  # Older schemas are historical templates, not instructions to create missing
  # handoff/progress files for current tasks. No unimplemented gate is a prerequisite.
  convention: docs/harness/workflow.md#4-programs-and-large-changes

# -- Knowledge locations ------------------------------------------------------
knowledge:
  design_and_plans: docs/
  architecture_decisions: docs/architecture/
  programs: deploy/runbooks/
  evidence_and_reports: reports/
  archive: docs/archive/
