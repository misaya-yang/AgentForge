; Rendered by platform-data-security render; this reviewed default targets database gateway.
; No wildcard database, forced backend user, auth_query, or plaintext credential.
[databases]
gateway_tx = host=postgres-backend port=5432 dbname=gateway pool_mode=transaction
gateway_session = host=postgres-backend port=5432 dbname=gateway pool_mode=session
runtime_tx = host=postgres-backend port=5432 dbname=gateway pool_mode=transaction
runtime_session = host=postgres-backend port=5432 dbname=gateway pool_mode=session
capability_worker_tx = host=postgres-backend port=5432 dbname=gateway pool_mode=transaction
capability_worker_session = host=postgres-backend port=5432 dbname=gateway pool_mode=session
knowledge_api_tx = host=postgres-backend port=5432 dbname=gateway pool_mode=transaction
knowledge_api_session = host=postgres-backend port=5432 dbname=gateway pool_mode=session
knowledge_worker_tx = host=postgres-backend port=5432 dbname=gateway pool_mode=transaction
knowledge_worker_session = host=postgres-backend port=5432 dbname=gateway pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
pidfile = /tmp/pgbouncer.pid
pool_mode = transaction
auth_type = cert
auth_file = /run/secrets/pgbouncer-users.txt
client_tls_sslmode = verify-full
client_tls_ca_file = /run/data-tls/ca-bundle.pem
client_tls_cert_file = /run/data-tls/pgbouncer.crt
client_tls_key_file = /run/data-tls/pgbouncer.key
client_tls_protocols = secure
server_tls_sslmode = verify-full
server_tls_ca_file = /run/data-tls/ca-bundle.pem
server_tls_cert_file = /run/data-tls/pgbouncer-backend.crt
server_tls_key_file = /run/data-tls/pgbouncer-backend.key
server_tls_protocols = secure
max_client_conn = 256
default_pool_size = 4
min_pool_size = 0
reserve_pool_size = 0
max_db_connections = 8
max_user_connections = 8
max_prepared_statements = 200
server_reset_query = DISCARD ALL
server_reset_query_always = 1
server_connect_timeout = 5
server_login_retry = 5
query_wait_timeout = 10
query_timeout = 300
idle_transaction_timeout = 30
server_idle_timeout = 60
server_lifetime = 1800
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
ignore_startup_parameters = extra_float_digits

[users]
ai_gateway_gateway = max_user_connections=8 pool_size=4 reserve_pool_size=0
ai_gateway_runtime = max_user_connections=8 pool_size=4 reserve_pool_size=0
ai_gateway_capability_worker = max_user_connections=8 pool_size=4 reserve_pool_size=0
ai_gateway_knowledge_api = max_user_connections=8 pool_size=4 reserve_pool_size=0
ai_gateway_knowledge_worker = max_user_connections=8 pool_size=4 reserve_pool_size=0
