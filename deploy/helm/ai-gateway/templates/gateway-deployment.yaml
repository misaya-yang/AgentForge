apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.fullname" . }}-gateway
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  # Gateway owns process-local schedulers and SSE state. Keep this literal so
  # a values override cannot accidentally create concurrent owners.
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  strategy:
    # RollingUpdate with maxSurge would briefly run two scheduler owners.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "ai-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-schema-authority
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "database.authority", "startup-check"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: AI_GATEWAY_DATABASE_GATEWAY_DSN
              value: {{ include "ai-gateway.postgresDSN" . | quote }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ai-gateway.fullname" . }}-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: REDIS_PASSWORD
            - name: GATEWAY_DATABASE__DSN
              value: {{ include "ai-gateway.postgresDSN" . | quote }}
            - name: GATEWAY_REDIS__URL
              value: {{ include "ai-gateway.redisURL" . | quote }}
            - name: GATEWAY_AUTHENTICATION__JWT__SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: JWT_SECRET
            {{- if .Values.secrets.dashscopeApiKey }}
            - name: GATEWAY_KNOWLEDGE__DASHSCOPE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: DASHSCOPE_API_KEY
            {{- end }}
            {{- if .Values.langgraph.enabled }}
            - name: GATEWAY_LANGGRAPH__ENABLED
              value: "true"
            - name: GATEWAY_LANGGRAPH__INSTANCE_URLS
              value: {{ include "ai-gateway.langgraphInstanceURLs" . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.liveness.path }}
              port: {{ .Values.gateway.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.gateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.liveness.periodSeconds }}
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.readiness.path }}
              port: {{ .Values.gateway.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.gateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.readiness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
