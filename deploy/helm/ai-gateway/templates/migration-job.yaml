{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-gateway.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  {{- if .Release.IsUpgrade }}
  annotations:
    # On install this is a normal Job so the chart-owned Secret/PostgreSQL
    # already exist; application initContainers wait on startup-check. During
    # upgrades the existing database is available and this hook blocks rollout.
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "ai-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          command:
            - python
            - -m
            - database.authority
            - migrate
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: GATEWAY_DATABASE__ENABLED
              value: "true"
            - name: AI_GATEWAY_DATABASE_MIGRATOR_DSN
              value: {{ include "ai-gateway.postgresDSN" . | quote }}
{{- end }}
