{{- if and .Values.langgraph.enabled .Values.postgresql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-gateway.fullname" . }}-langgraph-db-init-{{ .Release.Revision }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: langgraph-db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ai-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: langgraph-db-init
    spec:
      restartPolicy: Never
      containers:
        - name: init-db
          image: {{ .Values.postgresql.image }}
          command:
            - /bin/sh
            - -c
            - |
              {{- range $name, $agent := .Values.langgraph.agents }}
              {{- if $agent.enabled }}
              echo "Creating database {{ $agent.databaseName }} if not exists..."
              psql "$PGCONN" -tc "SELECT 1 FROM pg_database WHERE datname = '{{ $agent.databaseName }}'" | grep -q 1 || \
                psql "$PGCONN" -c "CREATE DATABASE {{ $agent.databaseName }};"
              {{- end }}
              {{- end }}
              echo "LangGraph databases initialized."
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: PGCONN
              value: "postgresql://{{ include "ai-gateway.postgresUser" . }}:$(POSTGRES_PASSWORD)@{{ include "ai-gateway.postgresHost" . }}:{{ include "ai-gateway.postgresPort" . }}/postgres"
{{- end }}
