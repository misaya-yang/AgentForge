{{- if .Values.knowledgeService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.fullname" . }}-knowledge
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge
spec:
  {{- if not .Values.knowledgeService.autoscaling.enabled }}
  replicas: {{ .Values.knowledgeService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: knowledge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "ai-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: knowledge
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-schema-authority
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "database.authority", "startup-check", "--principal", "knowledge_api"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: AI_GATEWAY_DATABASE_KNOWLEDGE_API_DSN
              value: {{ include "ai-gateway.postgresDSN" . | quote }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: knowledge
                topologyKey: kubernetes.io/hostname
      containers:
        - name: knowledge
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.knowledgeService.image.repository }}:{{ .Values.knowledgeService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8092
              protocol: TCP
          env:
            {{- range $key, $value := .Values.knowledgeService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: REDIS_PASSWORD
            - name: KNOWLEDGE_DATABASE__DSN
              value: {{ include "ai-gateway.postgresDSN" . | quote }}
            - name: KNOWLEDGE_REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "ai-gateway.redisHost" . }}:{{ include "ai-gateway.redisPort" . }}/2"
            - name: KNOWLEDGE_QDRANT__URL
              value: {{ include "ai-gateway.qdrantUrl" . | quote }}
            {{- if .Values.secrets.dashscopeApiKey }}
            - name: KNOWLEDGE_EMBEDDINGS__API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: DASHSCOPE_API_KEY
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8092
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8092
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.knowledgeService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-knowledge
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge
spec:
  type: ClusterIP
  ports:
    - port: 8092
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge
---
{{- if .Values.knowledgeService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai-gateway.fullname" . }}-knowledge
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ai-gateway.fullname" . }}-knowledge
  minReplicas: {{ .Values.knowledgeService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.knowledgeService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.knowledgeService.autoscaling.targetCPUUtilization }}
{{- end }}
{{- end }}
