apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.fullname" . }}-gateway
  labels:
{{ include "ai-gateway.labels" . | indent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
{{ include "ai-gateway.labels" . | indent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "ai-gateway.fullname" . }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      imagePullSecrets: {{ .Values.global.imagePullSecrets | toJson }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: gateway
      initContainers:
      - name: database-authority
        image: {{ include "ai-gateway.image" (dict "root" . "unit" "migrate") | quote }}
        command: ["/bin/sh", "-ec"]
        args: ["mkdir -p /state/data /state/logs /state/agent-memory /state/data/images /state/data/pdf-scratch; chmod 700 /state/agent-memory; exec /usr/local/bin/database-authority startup-check --principal gateway"]
        resources:
{{ toYaml .Values.resources.migration | indent 10 }}
        securityContext:
{{ include "ai-gateway.security" 1000 | indent 10 }}
        env:
{{ include "ai-gateway.roleEnv" (dict "root" . "env" "AI_GATEWAY_DATABASE_GATEWAY_DSN" "key" "GATEWAY_DSN") | indent 8 }}
        - name: AI_GATEWAY_ROLE_PREFIX
          value: {{ .Values.databaseRoles.rolePrefix | quote }}
        volumeMounts:
        - {name: state, mountPath: /state}
        - {name: tmp, mountPath: /tmp}
      - name: lease-signing-key
        image: {{ include "ai-gateway.image" (dict "root" . "unit" "gateway") | quote }}
        command: [/bin/sh, -ec, "umask 077; cp /input/private.json /output/private.json; chmod 400 /output/private.json"]
        resources:
{{ toYaml .Values.resources.migration | indent 10 }}
        securityContext:
{{ include "ai-gateway.security" 1000 | indent 10 }}
        env:
{{ include "ai-gateway.roleEnv" (dict "root" . "env" "AI_GATEWAY_DATABASE_GATEWAY_DSN" "key" "GATEWAY_DSN") | indent 8 }}
        volumeMounts:
        - {name: lease-input, mountPath: /input, readOnly: true}
        - {name: lease, mountPath: /output}
      containers:
      - name: gateway
        image: {{ include "ai-gateway.image" (dict "root" . "unit" "gateway") | quote }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
{{ include "ai-gateway.security" 1000 | indent 10 }}
        resources:
{{ toYaml (index .Values.resources "gateway") | indent 10 }}
        command: ["/usr/local/bin/gateway", "--config-env"]
        env:
{{ include "ai-gateway.roleEnv" (dict "root" . "env" "GATEWAY_DATABASE__DSN" "key" "GATEWAY_DSN") | indent 8 }}
{{ include "ai-gateway.secretEnv" (dict "env" "GATEWAY_REDIS__URL" "secret" .Values.credentials.gateway "key" "REDIS_URL") | indent 8 }}
{{ include "ai-gateway.secretEnv" (dict "env" "GATEWAY_AUTHENTICATION__JWT__SECRET" "secret" .Values.credentials.gateway "key" "GATEWAY_AUTHENTICATION__JWT__SECRET") | indent 8 }}
{{ include "ai-gateway.secretEnv" (dict "env" "GATEWAY_ENCRYPTION_KEY" "secret" .Values.credentials.gateway "key" "GATEWAY_ENCRYPTION_KEY") | indent 8 }}
{{ include "ai-gateway.secretEnv" (dict "env" "AI_PLATFORM_INTERNAL_TOKEN" "secret" .Values.credentials.gateway "key" "AI_PLATFORM_INTERNAL_TOKEN") | indent 8 }}
{{ include "ai-gateway.secretEnv" (dict "env" "AI_PLATFORM_CAPABILITY_PROOF_SECRET" "secret" .Values.credentials.gateway "key" "AI_PLATFORM_CAPABILITY_PROOF_SECRET") | indent 8 }}
        - name: GATEWAY_NATIVE_CONFIG
          value: "/app/config/native-gateway.json"
        - name: GATEWAY_HOST
          value: "0.0.0.0"
        - name: GATEWAY_PORT
          value: "8080"
        - name: GATEWAY_DATABASE__ENABLED
          value: "true"
        - name: GATEWAY_DATABASE__AUTO_INIT
          value: "false"
        - name: GATEWAY_REDIS__ENABLED
          value: "true"
        - name: GATEWAY_AUTHENTICATION__JWT__ENABLED
          value: "true"
        - name: GATEWAY_KNOWLEDGE__ENABLED
          value: "true"
        - name: GATEWAY_KNOWLEDGE__QDRANT__ENABLED
          value: "false"
        - name: GATEWAY_STORAGE__BACKEND
          value: {{ ternary "s3" "local" .Values.data.objectStore.enabled | quote }}
        - name: GATEWAY_STORAGE__LOCAL_BASE_PATH
          value: "/app/data/images"
        - name: AI_PLATFORM_LEASE_TRUST_MODE
          value: "verify_only"
        - name: AI_PLATFORM_GATEWAY_ED25519_KEYRING_FILE
          value: "/run/lease/private.json"
{{ include "ai-gateway.roleEnv" (dict "root" . "env" "AI_GATEWAY_DATABASE_GATEWAY_DSN" "key" "GATEWAY_DSN") | indent 8 }}
        - name: AI_PLATFORM_GATEWAY_INTERNAL_URL
          value: http://{{ include "ai-gateway.fullname" . }}-gateway:8080
        - name: AI_PLATFORM_AGENT_RUNTIME_URL
          value: http://{{ include "ai-gateway.fullname" . }}-agent-runtime:8094
        - name: AI_PLATFORM_CAPABILITY_WORKER_URL
          value: http://{{ include "ai-gateway.fullname" . }}-agent-capability-worker:8095
        - name: AI_PLATFORM_KNOWLEDGE_SERVICE_URL
          value: http://{{ include "ai-gateway.fullname" . }}-knowledge:8092
        - name: AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION
          value: {{ .Values.gateway.nativeOptions.kernel_revision | quote }}
        - name: AI_PLATFORM_KNOWLEDGE_MODEL_WORKLOAD_PUBLIC_KEYS_FILE
          value: /run/knowledge-model-public/public.json
        - name: AI_PLATFORM_KNOWLEDGE_MODEL_PRICE_BOOK_REVISION
          value: {{ required "Activated price book revision required" .Values.modelPlane.priceBookRevision | quote }}
{{- if .Values.data.objectStore.enabled }}
        - name: GATEWAY_STORAGE__S3__ENDPOINT_URL
          value: {{ .Values.data.objectStore.endpoint | quote }}
        - name: GATEWAY_STORAGE__S3__BUCKET
          value: {{ .Values.data.objectStore.bucket | quote }}
        - name: GATEWAY_STORAGE__S3__REGION
          value: {{ .Values.data.objectStore.region | quote }}
{{ include "ai-gateway.secretEnv" (dict "env" "GATEWAY_STORAGE__S3__ACCESS_KEY" "secret" .Values.data.objectStore.existingSecret "key" "ACCESS_KEY") | indent 8 }}
{{ include "ai-gateway.secretEnv" (dict "env" "GATEWAY_STORAGE__S3__SECRET_KEY" "secret" .Values.data.objectStore.existingSecret "key" "SECRET_KEY") | indent 8 }}
{{- end }}
{{- if .Values.sdkWorker.enabled }}
        - {name: SDK_AGENT_GATEWAY_TLS_ENABLED, value: "true"}
        - {name: SDK_AGENT_GATEWAY_TLS_BIND, value: "0.0.0.0:8097"}
        - {name: SDK_AGENT_GATEWAY_TLS_CERT_FILE, value: /run/sdk-callback/tls.crt}
        - {name: SDK_AGENT_GATEWAY_TLS_KEY_FILE, value: /run/sdk-callback/tls.key}
        - {name: SDK_AGENT_WORKER_TLS_CA_FILE, value: /run/sdk-worker/ca.pem}
        - name: SDK_AGENT_WORKER_URL
          value: https://{{ include "ai-gateway.fullname" . }}-sdk:8096
{{ include "ai-gateway.secretEnv" (dict "env" "SDK_AGENT_WORKER_TOKEN" "secret" .Values.sdkWorker.credentialsSecret "key" "SDK_AGENT_WORKER_TOKEN") | indent 8 }}
{{- end }}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /health/ready, port: http}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /health/ready, port: http}
          initialDelaySeconds: 30
        volumeMounts:
        - {name: knowledge-model-public, mountPath: /run/knowledge-model-public/public.json, subPath: public.json, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        - {name: state, mountPath: /app/data, subPath: data}
        - {name: state, mountPath: /app/logs, subPath: logs}
        - {name: state, mountPath: /app/agent-memory, subPath: agent-memory}
        - {name: config, mountPath: /app/config/native-gateway.json, subPath: native-gateway.json, readOnly: true}
        - {name: lease, mountPath: /run/lease, readOnly: true}
{{- if .Values.sdkWorker.enabled }}
        - {name: sdk-worker-ca, mountPath: /run/sdk-worker, readOnly: true}
        - {name: sdk-callback, mountPath: /run/sdk-callback, readOnly: true}
{{- end }}
      volumes:
      - name: tmp
        emptyDir: {medium: Memory, sizeLimit: 128Mi}
      - name: config
        configMap:
          name: {{ include "ai-gateway.fullname" . }}-config
      - name: state
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.gateway.existingClaim | quote }}
      - name: lease
        emptyDir: {medium: Memory, sizeLimit: 1Mi}
      - name: lease-input
        secret:
          defaultMode: 0440
          secretName: {{ .Values.lease.gatewayPrivateSecret | quote }}
      - name: knowledge-model-public
        configMap:
          name: {{ .Values.modelPlane.knowledgeWorkloadPublicConfigMap | quote }}
{{- if .Values.sdkWorker.enabled }}
      - name: sdk-worker-ca
        secret:
          secretName: {{ .Values.sdkWorker.workerTLSSecret | quote }}
          items: [{key: ca.pem, path: ca.pem}]
      - name: sdk-callback
        secret:
          secretName: {{ .Values.sdkWorker.callbackTLSSecret | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-gateway
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
  - {name: http, port: 8080, targetPort: http}
{{- if .Values.sdkWorker.enabled }}
  - {name: sdk-callback, port: 8097, targetPort: 8097}
{{- end }}
