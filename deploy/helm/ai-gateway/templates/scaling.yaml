{{- range $component, $key := dict "frontend" "frontend" "knowledge" "knowledgeService" }}
{{- $unit := index $.Values $key }}
{{- if $unit.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai-gateway.fullname" $ }}-{{ $component }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "ai-gateway.fullname" $ }}-{{ $component }}}
  minReplicas: {{ $unit.autoscaling.minReplicas }}
  maxReplicas: {{ $unit.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: {{ $unit.autoscaling.targetCPUUtilization }}}
{{- end }}
{{- if $.Values.availability.pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-gateway.fullname" $ }}-{{ $component }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- if .Values.knowledgeWorker.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ai-gateway.fullname" . }}-knowledge-worker
spec:
  scaleTargetRef: {name: {{ include "ai-gateway.fullname" . }}-knowledge-worker}
  minReplicaCount: 1
  maxReplicaCount: 8
  triggers:
  - type: postgresql
    metadata:
      query: {{ required "Reviewed tenant-safe pending queue count query required" .Values.knowledgeWorker.keda.query | quote }}
      targetQueryValue: "10"
    authenticationRef:
      name: {{ required "KEDA scoped PostgreSQL authentication required" .Values.knowledgeWorker.keda.authenticationRef | quote }}
{{- end }}
