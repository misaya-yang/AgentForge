{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-postgresql
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: tcp-pg
      protocol: TCP
      name: tcp-pg
  selector:
    {{- include "ai-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
