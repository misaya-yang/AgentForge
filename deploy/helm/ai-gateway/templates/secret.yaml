apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-gateway.fullname" . }}-secret
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ include "ai-gateway.postgresUser" . | b64enc | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | b64enc | quote }}
  REDIS_PASSWORD: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | b64enc | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | b64enc | quote }}
  LANGGRAPH_CLOUD_LICENSE_KEY: {{ .Values.secrets.langgraphCloudLicenseKey | default "" | b64enc | quote }}
  {{- if .Values.secrets.dashscopeApiKey }}
  DASHSCOPE_API_KEY: {{ .Values.secrets.dashscopeApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalQdrant.apiKey }}
  QDRANT_API_KEY: {{ .Values.externalQdrant.apiKey | b64enc | quote }}
  {{- end }}
