apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.fullname" . }}-config
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.gateway.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  GATEWAY_KNOWLEDGE__QDRANT__URL: {{ include "ai-gateway.qdrantUrl" . | quote }}
