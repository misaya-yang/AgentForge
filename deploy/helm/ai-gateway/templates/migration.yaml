apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-gateway.fullname" . }}-migration
  labels:
{{ include "ai-gateway.labels" . | indent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
{{ include "ai-gateway.labels" . | indent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      imagePullSecrets: {{ .Values.global.imagePullSecrets | toJson }}
      containers:
      - name: migration
        image: {{ include "ai-gateway.image" (dict "root" . "unit" "migrate") | quote }}
        command: [/usr/local/bin/database-authority, migrate]
        securityContext:
{{ include "ai-gateway.security" 1000 | indent 10 }}
        resources:
{{ toYaml .Values.resources.migration | indent 10 }}
        env:
{{ include "ai-gateway.roleEnv" (dict "root" . "env" "AI_GATEWAY_DATABASE_MIGRATOR_DSN" "key" "MIGRATOR_DSN") | indent 8 }}
        - name: AI_GATEWAY_ROLE_PREFIX
          value: {{ .Values.databaseRoles.rolePrefix | quote }}
        volumeMounts:
{{- if .Values.dataSecurity.enabled }}
{{- range $file := list "dsn" "ca-bundle.pem" "tls.crt" "tls.key" }}
        - {name: data-credentials, mountPath: /run/data/credentials/{{ $file }}, subPath: {{ $file }}, readOnly: true}
{{- end }}
{{- end }}
        - {name: tmp, mountPath: /tmp}
      volumes:
{{ include "ai-gateway.dataVolumes" (dict "root" . "role" "migrator") | indent 6 }}
      - name: tmp
        emptyDir: {medium: Memory, sizeLimit: 64Mi}
