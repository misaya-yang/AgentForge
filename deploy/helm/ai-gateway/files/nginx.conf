# =============================================================================
# AI Gateway Frontend - Nginx Configuration
# =============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Prefer the smaller precompressed representation. q=0 is never accepted.
    map $http_accept_encoding $negotiated_asset_suffix {
        default "";
        "~*(?:^|,)\s*br\s*(?:;\s*q=(?:1(?:\.0{0,3})?|0\.[0-9]*[1-9][0-9]*))?\s*(?:,|$)" .br;
        "~*(?:^|,)\s*zstd\s*(?:;\s*q=(?:1(?:\.0{0,3})?|0\.[0-9]*[1-9][0-9]*))?\s*(?:,|$)" .zst;
        "~*(?:^|,)\s*gzip\s*(?:;\s*q=(?:1(?:\.0{0,3})?|0\.[0-9]*[1-9][0-9]*))?\s*(?:,|$)" .gz;
    }
    map $negotiated_asset_suffix $negotiated_asset_encoding {
        default "";
        .br br;
        .zst zstd;
        .gz gzip;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Dynamic DNS resolution for Docker container networking
        # Prevents stale IP cache when backend containers restart
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend "gateway:8080";

        # Security headers
        include /tmp/frontend-security-headers.conf;

        # Health check endpoint (exact match to avoid regex override)
        location = /health {
            access_log off;
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }

        # Dedicated dynamic Embed document. Defining location-level headers
        # prevents inheritance of the server SAMEORIGIN/CSP list; Gateway emits
        # the exact Publication-derived frame-ancestors policy and no XFO.
        location /embed/agents/ {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # API proxy - forward to backend
        location /api/ {
            # Gateway applies endpoint-specific JSON and multipart limits and
            # caps KB upload envelopes below 50 MiB.  Keep nginx above that
            # authoritative fence so clients receive the Gateway's structured
            # 413 detail instead of nginx's generic 1 MiB rejection page.
            client_max_body_size 50m;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeout settings for long-running requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering settings for streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # V1 API compatibility
        location /v1/ {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # WebSocket support
        location /ws/ {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # Backend health endpoint (for direct backend health check if needed)
        location = /api/health {
            proxy_pass http://$backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # native Gateway auto-generated API documentation
        location = /docs {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /redoc {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.json {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /scalar {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Runtime config is generated at container start and must not be
        # cached across deploy-time env changes.
        location = /runtime-config.json {
            root /tmp;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            include /tmp/frontend-security-headers.conf;
            try_files $uri =404;
        }

        # Static assets with caching
        location ~ ^/assets/.*\.map(?:\.(?:br|zst|gz))?$ { return 404; }
        location ~ ^/assets/.*\.js$ {
            types { } default_type application/javascript;
            include /etc/nginx/nginx-precompressed-assets.conf;
        }
        location ~ ^/assets/.*\.css$ {
            types { } default_type text/css;
            include /etc/nginx/nginx-precompressed-assets.conf;
        }
        location ~ ^/assets/.*\.json$ {
            types { } default_type application/json;
            include /etc/nginx/nginx-precompressed-assets.conf;
        }
        location ~ ^/assets/.*\.svg$ {
            types { } default_type image/svg+xml;
            include /etc/nginx/nginx-precompressed-assets.conf;
        }
        location ~ ^/assets/.*\.wasm$ {
            types { } default_type application/wasm;
            include /etc/nginx/nginx-precompressed-assets.conf;
        }
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /tmp/frontend-security-headers.conf;
            try_files $uri =404;
        }

        # SPA fallback - serve index.html for all other routes
        location / {
            try_files $uri $uri/ /index.html;

            # No cache for HTML to ensure fresh content
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                include /tmp/frontend-security-headers.conf;
            }
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
