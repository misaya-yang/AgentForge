{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ required "Existing SecretStore required" $.Values.storeRef.name | quote }}
    kind: {{ $.Values.storeRef.kind }}
  target:
    name: {{ .name | quote }}
    creationPolicy: Owner
  data:
{{- range .keys }}
  - secretKey: {{ .secretKey | quote }}
    remoteRef:
      key: {{ .remoteKey | quote }}
{{- if .property }}
      property: {{ .property | quote }}
{{- end }}
{{- end }}
{{- end }}
