# Disposable pure principal/policy/retrieval cache. No coordination keys here.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6380
tls-cert-file /run/valkey/tls.crt
tls-key-file /run/valkey/tls.key
tls-ca-cert-file /run/valkey/ca.pem
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /run/valkey/users.acl
maxmemory 128mb
maxmemory-policy allkeys-lru
appendonly no
save ""
dir /data
logfile ""
daemonize no
