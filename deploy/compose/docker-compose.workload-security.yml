      AI_PLATFORM_CAPABILITY_PROOF_SECRET_FILE: !reset null
      AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET: !reset null
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN: !reset null
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN_FILE: !reset null
      AI_PLATFORM_LEASE_TRUST_MODE: verify_only
      AI_PLATFORM_BROKER_PROOF_MODE: verify_only
      AI_PLATFORM_LEASE_VERIFY_KEYRING_FILE: /run/lease/public.json
      AI_PLATFORM_CAPABILITY_PLANE_URL: https://gateway-workload:8443/internal/v2/agent-capabilities
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_RUNTIME_BASE_URL: https://gateway-workload:8443/internal/v1/agent-model-plane
      AI_PLATFORM_RUNTIME_MODEL_PROXY_BASE_URL: http://127.0.0.1:8094/internal/v1/model-proxy
      AI_PLATFORM_CAPABILITY_WORKER_URL: https://agent-capability-worker-workload:8455
      AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET_FILE: !reset null
      AI_PLATFORM_RUNTIME_MODEL_PROXY_TOKEN: ${RUNTIME_MODEL_PROXY_TOKEN:?Provision a Runtime-local bridge token of at least 32 bytes}
      AI_PLATFORM_GATEWAY_INTERNAL_URL: https://gateway-workload:8443
      AI_PLATFORM_KNOWLEDGE_SERVICE_URL: https://knowledge-service-workload:8452
    expose:
    - '8454'
    networks:
      app:
        aliases:
        - agent-runtime-workload
    volumes:
    - type: bind
      source: ${WORKLOAD_PRIVATE_DIRECTORY:?Select per-service workload generations}/agent-runtime
      target: /run/workload/credentials
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${WORKLOAD_PUBLIC_KEYRING_FILE:?Select the Gateway public verification keyring}
      target: /run/lease/public.json
      read_only: true
      bind:
        create_host_path: false
