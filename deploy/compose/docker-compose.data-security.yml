# Opt-in real file-DSN/mTLS entrypoint, merged after root/local application files.
# Existing authority admission is required before enabling PostgreSQL cert-only TCP.
# Bootstrap retains its dependency gate but uses read-only role admission, with no admin mount.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-bootstrap-password
    command:
    - postgres
    - -c
    - ssl=on
    - -c
    - ssl_min_protocol_version=TLSv1.3
    - -c
    - ssl_cert_file=/run/data-tls/postgres.crt
    - -c
    - ssl_key_file=/run/data-tls/postgres.key
    - -c
    - ssl_ca_file=/run/data-tls/ca-bundle.pem
    - -c
    - hba_file=/etc/postgresql/pg_hba.conf
    - -c
    - password_encryption=scram-sha-256
    volumes:
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Supply the generated external private material
        directory}/postgres-bootstrap-password
      target: /run/secrets/postgres-bootstrap-password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Supply private material}/postgres
      target: /run/data-tls
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Supply private material}/pg_hba.conf
      target: /etc/postgresql/pg_hba.conf
      read_only: true
      bind:
        create_host_path: false
    networks:
      data-postgres: {}
      data-pgbouncer-backend:
        aliases:
        - postgres-backend
  gateway:
    environment:
      DATA_GATEWAY_DSN_FILE: /run/data/credentials/dsn-control
      DATA_GATEWAY_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_GATEWAY_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_GATEWAY_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_GATEWAY_MODE: direct
      DATA_GATEWAY_EXPECTED_HOST: postgres
      DATA_GATEWAY_DATABASE_ALIAS: ${POSTGRES_DB:-gateway}
      DATA_GATEWAY_PHYSICAL_DATABASE: ${POSTGRES_DB:-gateway}
      DATA_GATEWAY_POOL_MAX: '4'
      DATA_GATEWAY_REPLICAS: '1'
      DATA_GATEWAY_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_GATEWAY_POOLED_BACKEND_LIMIT: '8'
      DATA_GATEWAY_STATEMENT_TIMEOUT_MS: '30000'
      POSTGRES_HOST: !reset null
      POSTGRES_PORT: !reset null
      POSTGRES_USER: !reset null
      POSTGRES_PASSWORD: !reset null
      POSTGRES_DB: !reset null
      DATABASE_URL: !reset null
      AI_GATEWAY_DATABASE_GATEWAY_DSN: !reset null
      GATEWAY_DATABASE__DSN: !reset null
      DATA_GATEWAY_CONTROL_DSN_FILE: /run/data/credentials/dsn-control
      DATA_GATEWAY_CONTROL_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_GATEWAY_CONTROL_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_GATEWAY_CONTROL_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_GATEWAY_CONTROL_MODE: direct
      DATA_GATEWAY_CONTROL_EXPECTED_HOST: postgres
      DATA_GATEWAY_CONTROL_DATABASE_ALIAS: ${POSTGRES_DB:-gateway}
      DATA_GATEWAY_CONTROL_PHYSICAL_DATABASE: ${POSTGRES_DB:-gateway}
      DATA_GATEWAY_CONTROL_POOL_MAX: '2'
      DATA_GATEWAY_CONTROL_REPLICAS: '1'
      DATA_GATEWAY_CONTROL_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_GATEWAY_CONTROL_POOLED_BACKEND_LIMIT: '8'
      DATA_GATEWAY_CONTROL_STATEMENT_TIMEOUT_MS: '30000'
    volumes:
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Select generated private material}/ai_gateway_gateway
      target: /run/data/credentials
      read_only: true
      bind:
        create_host_path: false
  agent-runtime:
    environment:
      DATA_RUNTIME_DSN_FILE: /run/data/credentials/dsn-control
      DATA_RUNTIME_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_RUNTIME_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_RUNTIME_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_RUNTIME_MODE: direct
      DATA_RUNTIME_EXPECTED_HOST: postgres
      DATA_RUNTIME_DATABASE_ALIAS: ${POSTGRES_DB:-gateway}
      DATA_RUNTIME_PHYSICAL_DATABASE: ${POSTGRES_DB:-gateway}
      DATA_RUNTIME_POOL_MAX: '4'
      DATA_RUNTIME_REPLICAS: '1'
      DATA_RUNTIME_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_RUNTIME_POOLED_BACKEND_LIMIT: '8'
      DATA_RUNTIME_STATEMENT_TIMEOUT_MS: '30000'
      POSTGRES_HOST: !reset null
      POSTGRES_PORT: !reset null
      POSTGRES_USER: !reset null
      POSTGRES_PASSWORD: !reset null
      POSTGRES_DB: !reset null
      DATABASE_URL: !reset null
      AI_GATEWAY_DATABASE_RUNTIME_DSN: !reset null
    volumes:
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Select generated private material}/ai_gateway_runtime
      target: /run/data/credentials
      read_only: true
      bind:
        create_host_path: false
  agent-capability-worker:
    environment:
      DATA_CAPABILITY_WORKER_DSN_FILE: /run/data/credentials/dsn-control
      DATA_CAPABILITY_WORKER_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_CAPABILITY_WORKER_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_CAPABILITY_WORKER_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_CAPABILITY_WORKER_MODE: direct
      DATA_CAPABILITY_WORKER_EXPECTED_HOST: postgres
      DATA_CAPABILITY_WORKER_DATABASE_ALIAS: ${POSTGRES_DB:-gateway}
      DATA_CAPABILITY_WORKER_PHYSICAL_DATABASE: ${POSTGRES_DB:-gateway}
      DATA_CAPABILITY_WORKER_POOL_MAX: '4'
      DATA_CAPABILITY_WORKER_REPLICAS: '1'
      DATA_CAPABILITY_WORKER_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_CAPABILITY_WORKER_POOLED_BACKEND_LIMIT: '8'
      DATA_CAPABILITY_WORKER_STATEMENT_TIMEOUT_MS: '30000'
      POSTGRES_HOST: !reset null
      POSTGRES_PORT: !reset null
      POSTGRES_USER: !reset null
      POSTGRES_PASSWORD: !reset null
      POSTGRES_DB: !reset null
      DATABASE_URL: !reset null
      AI_GATEWAY_DATABASE_CAPABILITY_WORKER_DSN: !reset null
    volumes:
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Select generated private material}/ai_gateway_capability_worker
      target: /run/data/credentials
      read_only: true
      bind:
        create_host_path: false
  knowledge-service:
    environment:
      DATA_KNOWLEDGE_DSN_FILE: /run/data/credentials/dsn-control
      DATA_KNOWLEDGE_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_KNOWLEDGE_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_KNOWLEDGE_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_KNOWLEDGE_MODE: direct
      DATA_KNOWLEDGE_EXPECTED_HOST: postgres
      DATA_KNOWLEDGE_DATABASE_ALIAS: ${POSTGRES_DB:-gateway}
      DATA_KNOWLEDGE_PHYSICAL_DATABASE: ${POSTGRES_DB:-gateway}
      DATA_KNOWLEDGE_POOL_MAX: '4'
      DATA_KNOWLEDGE_REPLICAS: '1'
      DATA_KNOWLEDGE_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_KNOWLEDGE_POOLED_BACKEND_LIMIT: '8'
      DATA_KNOWLEDGE_STATEMENT_TIMEOUT_MS: '30000'
      POSTGRES_HOST: !reset null
      POSTGRES_PORT: !reset null
      POSTGRES_USER: !reset null
      POSTGRES_PASSWORD: !reset null
      POSTGRES_DB: !reset null
      DATABASE_URL: !reset null
      AI_GATEWAY_DATABASE_KNOWLEDGE_API_DSN: !reset null
      KNOWLEDGE_DATABASE__DSN: !reset null
    volumes:
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Select generated private material}/ai_gateway_knowledge_api
      target: /run/data/credentials
      read_only: true
      bind:
        create_host_path: false
  knowledge-worker:
    environment:
      DATA_KNOWLEDGE_DSN_FILE: /run/data/credentials/dsn-control
      DATA_KNOWLEDGE_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_KNOWLEDGE_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_KNOWLEDGE_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_KNOWLEDGE_MODE: direct
      DATA_KNOWLEDGE_EXPECTED_HOST: postgres
      DATA_KNOWLEDGE_DATABASE_ALIAS: ${POSTGRES_DB:-gateway}
      DATA_KNOWLEDGE_PHYSICAL_DATABASE: ${POSTGRES_DB:-gateway}
      DATA_KNOWLEDGE_POOL_MAX: '4'
      DATA_KNOWLEDGE_REPLICAS: '1'
      DATA_KNOWLEDGE_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_KNOWLEDGE_POOLED_BACKEND_LIMIT: '8'
      DATA_KNOWLEDGE_STATEMENT_TIMEOUT_MS: '30000'
      POSTGRES_HOST: !reset null
      POSTGRES_PORT: !reset null
      POSTGRES_USER: !reset null
      POSTGRES_PASSWORD: !reset null
      POSTGRES_DB: !reset null
      DATABASE_URL: !reset null
      AI_GATEWAY_DATABASE_KNOWLEDGE_WORKER_DSN: !reset null
      KNOWLEDGE_DATABASE__DSN: !reset null
    volumes:
    - type: bind
      source: ${DATA_PRIVATE_DIRECTORY:?Select generated private material}/ai_gateway_knowledge_worker
      target: /run/data/credentials
      read_only: true
      bind:
        create_host_path: false
  database-bootstrap:
    environment:
      AI_GATEWAY_DATABASE_MIGRATOR_DSN: !reset null
      AI_GATEWAY_DATABASE_MIGRATOR_DSN_FILE: /run/data/authority/migrator/dsn
      AI_GATEWAY_DATABASE_MIGRATOR_TLS_CA_FILE: /run/data/authority/migrator/ca-bundle.pem
      AI_GATEWAY_DATABASE_MIGRATOR_TLS_CERT_FILE: /run/data/authority/migrator/tls.crt
      AI_GATEWAY_DATABASE_MIGRATOR_TLS_KEY_FILE: /run/data/authority/migrator/tls.key
      AI_GATEWAY_DATABASE_GATEWAY_DSN: !reset null
      AI_GATEWAY_DATABASE_GATEWAY_DSN_FILE: /run/data/authority/gateway/dsn
      AI_GATEWAY_DATABASE_GATEWAY_TLS_CA_FILE: /run/data/authority/gateway/ca-bundle.pem
      AI_GATEWAY_DATABASE_GATEWAY_TLS_CERT_FILE: /run/data/authority/gateway/tls.crt
      AI_GATEWAY_DATABASE_GATEWAY_TLS_KEY_FILE: /run/data/authority/gateway/tls.key
      AI_GATEWAY_DATABASE_RUNTIME_DSN: !reset null
      AI_GATEWAY_DATABASE_RUNTIME_DSN_FILE: /run/data/authority/runtime/dsn
      AI_GATEWAY_DATABASE_RUNTIME_TLS_CA_FILE: /run/data/authority/runtime/ca-bundle.pem
      AI_GATEWAY_DATABASE_RUNTIME_TLS_CERT_FILE: /run/data/authority/runtime/tls.crt
      AI_GATEWAY_DATABASE_RUNTIME_TLS_KEY_FILE: /run/data/authority/runtime/tls.key
      AI_GATEWAY_DATABASE_CAPABILITY_WORKER_DSN: !reset null
      AI_GATEWAY_DATABASE_CAPABILITY_WORKER_DSN_FILE: /run/data/authority/capability_worker/dsn
      AI_GATEWAY_DATABASE_CAPABILITY_WORKER_TLS_CA_FILE: /run/data/authority/capability_worker/ca-bundle.pem
      AI_GATEWAY_DATABASE_CAPABILITY_WORKER_TLS_CERT_FILE: /run/data/authority/capability_worker/tls.crt
      AI_GATEWAY_DATABASE_CAPABILITY_WORKER_TLS_KEY_FILE: /run/data/authority/capability_worker/tls.key
      AI_GATEWAY_DATABASE_KNOWLEDGE_API_DSN: !reset null
      AI_GATEWAY_DATABASE_KNOWLEDGE_API_DSN_FILE: /run/data/authority/knowledge_api/dsn
      AI_GATEWAY_DATABASE_KNOWLEDGE_API_TLS_CA_FILE: /run/data/authority/knowledge_api/ca-bundle.pem
      AI_GATEWAY_DATABASE_KNOWLEDGE_API_TLS_CERT_FILE: /run/data/authority/knowledge_api/tls.crt
      AI_GATEWAY_DATABASE_KNOWLEDGE_API_TLS_KEY_FILE: /run/data/authority/knowledge_api/tls.key
      AI_GATEWAY_DATABASE_KNOWLEDGE_WORKER_DSN: !reset null
      AI_GATEWAY_DATABASE_KNOWLEDGE_WORKER_DSN_FILE: /run/data/authority/knowledge_worker/dsn
      AI_GATEWAY_DATABASE_KNOWLEDGE_WORKER_TLS_CA_FILE: /run/data/authority/knowledge_worker/ca-bundle.pem
      AI_GATEWAY_DATABASE_KNOWLEDGE_WORKER_TLS_CERT_FILE: /run/data/authority/knowledge_worker/tls.crt
      AI_GATEWAY_DATABASE_KNOWLEDGE_WORKER_TLS_KEY_FILE: /run/data/authority/knowledge_worker/tls.key
    volumes:
    - type: bind
      source: ${DATA_AUTHORITY_DIRECTORY:?Select separate private authority material}/migrator
      target: /run/data/authority/migrator
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_AUTHORITY_DIRECTORY:?Select separate private authority material}/gateway
      target: /run/data/authority/gateway
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_AUTHORITY_DIRECTORY:?Select separate private authority material}/runtime
      target: /run/data/authority/runtime
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_AUTHORITY_DIRECTORY:?Select separate private authority material}/capability_worker
      target: /run/data/authority/capability_worker
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_AUTHORITY_DIRECTORY:?Select separate private authority material}/knowledge_api
      target: /run/data/authority/knowledge_api
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_AUTHORITY_DIRECTORY:?Select separate private authority material}/knowledge_worker
      target: /run/data/authority/knowledge_worker
      read_only: true
      bind:
        create_host_path: false
    command:
    - deployment-file-admission
    - --expected-database
    - ${POSTGRES_DB:-gateway}
  migrate:
    environment:
      AI_GATEWAY_DATABASE_MIGRATOR_DSN: !reset null
      AI_GATEWAY_DATABASE_MIGRATOR_DSN_FILE: /run/data/authority/migrator/dsn
      AI_GATEWAY_DATABASE_MIGRATOR_TLS_CA_FILE: /run/data/authority/migrator/ca-bundle.pem
      AI_GATEWAY_DATABASE_MIGRATOR_TLS_CERT_FILE: /run/data/authority/migrator/tls.crt
      AI_GATEWAY_DATABASE_MIGRATOR_TLS_KEY_FILE: /run/data/authority/migrator/tls.key
    volumes:
    - type: bind
      source: ${DATA_AUTHORITY_DIRECTORY:?Select separate private authority material}/migrator
      target: /run/data/authority/migrator
      read_only: true
      bind:
        create_host_path: false
networks:
  data-postgres:
    internal: true
    ipam:
      config:
      - subnet: ${DATA_CLIENT_CIDR:?Declare and validate the selected existing client-network
          subnet}
  data-pgbouncer-backend:
    internal: true
    ipam:
      config:
      - subnet: ${DATA_BACKEND_CIDR:?Declare a separate validated pooler-backend subnet}
