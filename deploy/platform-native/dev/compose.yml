# Standalone compiler role under the existing project. No application or infrastructure startup.
services:
  native-build:
    image: agentforge-native-dev:rust1.99.0
    pull_policy: never
    profiles: [native-dev]
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_HOME: /native-cache/cargo
      CARGO_TARGET_DIR: /native-cache/target
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTUP_HOME: /usr/local/rustup
      HOME: /tmp
    volumes:
      - native-dev-cache:/native-cache
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/platform-native:/source/rust/platform-native:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/agent-plugins/ai-quiz/native:/source/agent-plugins/ai-quiz/native:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/Cargo.toml:/source/rust/agent-runtime-overlay/kernel-rs/Cargo.toml:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/ai-platform-sdk-agent-engine:/source/rust/agent-runtime-overlay/kernel-rs/ai-platform-sdk-agent-engine:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/ai-platform-capability-contract:/source/rust/agent-runtime-overlay/kernel-rs/ai-platform-capability-contract:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/ai-platform-plugin-quiz:/source/rust/agent-runtime-overlay/kernel-rs/ai-platform-plugin-quiz:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/ai-platform-python-compat:/source/rust/agent-runtime-overlay/kernel-rs/ai-platform-python-compat:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/database:/source/database:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/tests:/source/tests:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/docs:/source/docs:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/deploy:/source/deploy:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/scripts:/source/scripts:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/sdk/rust/generated_models.rs:/source/sdk/rust/generated_models.rs:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/sdk/fixtures:/source/sdk/fixtures:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/sdk/openapi:/source/sdk/openapi:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/sdk/openapi.json:/source/sdk/openapi.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/sdk/openapi-profiles.json:/source/sdk/openapi-profiles.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/sdk/native-common-contracts.json:/source/sdk/native-common-contracts.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/apps/local-node/native/macos/LocalNodeMacOSHelper.swift:/source/apps/local-node/native/macos/LocalNodeMacOSHelper.swift:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/ai-platform-agent-runtime/src/schema_admission_expected.json:/source/rust/agent-runtime-overlay/kernel-rs/ai-platform-agent-runtime/src/schema_admission_expected.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/ai-platform-capability-worker/src/schema_admission_expected.json:/source/rust/agent-runtime-overlay/kernel-rs/ai-platform-capability-worker/src/schema_admission_expected.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/src/services/eval/fixtures/real_finance_salesforce_fy26_q1/golden.v1.json:/source/src/services/eval/fixtures/real_finance_salesforce_fy26_q1/golden.v1.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/src/services/eval/fixtures/real_research/cra_excerpt_provenance.v1.json:/source/src/services/eval/fixtures/real_research/cra_excerpt_provenance.v1.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/web/src/pages/knowledge/sources/sourceSyncContract.fixture.json:/source/web/src/pages/knowledge/sources/sourceSyncContract.fixture.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/reports/dots-source-import-20261015.json:/source/reports/dots-source-import-20261015.json:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/AGENTS.md:/source/AGENTS.md:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/Makefile:/source/Makefile:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/harness.yml:/source/harness.yml:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust-toolchain.toml:/source/rust-toolchain.toml:ro
volumes:
  native-dev-cache:
    name: agentforge-dev-7801d4a9a4_native-dev-cache
    labels:
      agentforge.native.owner: ${NATIVE_CONTAINER_ROOT:?launcher required}
      agentforge.native.cache: rust-1.99.0-single
