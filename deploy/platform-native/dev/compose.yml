# Standalone compiler role under the existing project. No application or infrastructure startup.
services:
  native-build:
    image: agentforge-native-dev:rust1.99.0
    pull_policy: never
    profiles: [native-dev]
    user: "10001:10001"
    init: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=256m,mode=1777
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_HOME: /native-cache/cargo
      CARGO_TARGET_DIR: /native-cache/target
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTUP_HOME: /usr/local/rustup
      HOME: /tmp
    volumes:
      - native-dev-cache:/native-cache
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/platform-native:/source/rust/platform-native:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/agent-plugins/ai-quiz/native:/source/agent-plugins/ai-quiz/native:ro
      - ${NATIVE_CONTAINER_ROOT:?launcher required}/rust/agent-runtime-overlay/kernel-rs/Cargo.toml:/source/rust/agent-runtime-overlay/kernel-rs/Cargo.toml:ro
