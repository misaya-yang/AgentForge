# Installing this object does not install or attest runsc. Nodes are admitted
# only after their pinned runtime, network=none, UDS and baseline probes pass.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: agentforge-gvisor
handler: runsc
scheduling:
  nodeSelector:
    agentforge.io/strong-sandbox-runtime: gvisor
