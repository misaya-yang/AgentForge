# cargo-deny 0.20.2. No ignored advisories, pruned crates or retired-parser waiver.
[graph]
all-features = true
exclude = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016", "OpenSSL"]
confidence-threshold = 0.95
exceptions = []

[licenses.private]
ignore = false

[bans]
# Parallel API generations are not a security exception; named retirements stay denied.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = ["serde_yaml", "serde_yml", "rustpython-ast", "rustpython-parser", "rustpython-parser-core", "rustpython-parser-vendored"]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
