# Canonical full local base, materialized from compose.yml + compose.runtime.yml
# + compose.apps.yml, before security removal. Source contract tests enforce
# freshness. Use this one base file with docker-compose.security.yml to avoid
# Compose multi-file/extends resets restoring a previously merged credential.
# Reuses the same existing project and all canonical volumes; no build fallback.
services:
  postgres:
    cap_drop: &id001
    - ALL
    read_only: true
    security_opt: &id002
    - no-new-privileges:true
    pids_limit: 256
    user: 70:70
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=1777
    - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=3775
    networks:
    - data-postgres
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
    - 127.0.0.1:${POSTGRES_PORT}:5432
    volumes:
    - postgres:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    cap_drop: *id001
    read_only: true
    security_opt: *id002
    pids_limit: 256
    user: 999:1000
    tmpfs: &id003
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    networks:
    - data-redis
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: 128mb
    command:
    - /bin/sh
    - /opt/redis-entrypoint.sh
    ports:
    - 127.0.0.1:${REDIS_PORT}:6379
    volumes:
    - redis:/data
    - ./scripts/new/redis-entrypoint.sh:/opt/redis-entrypoint.sh:ro
    mem_limit: 192m
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    cap_drop: *id001
    read_only: true
    security_opt: *id002
    pids_limit: 256
    user: 1000:1000
    tmpfs: *id003
    networks:
    - data
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Provision the Qdrant writer key}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?Provision a distinct Qdrant read-only key}
      QDRANT__SERVICE__ENABLE_TLS: 'true'
      QDRANT__TLS__CERT: /run/qdrant/tls.crt
      QDRANT__TLS__KEY: /run/qdrant/tls.key
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__STORAGE__TEMP_PATH: /qdrant/storage/snapshots_temp
      QDRANT_INIT_FILE_PATH: /qdrant/storage/.qdrant-initialized
    ports:
    - 127.0.0.1:${QDRANT_HTTP_PORT}:6333
    - 127.0.0.1:${QDRANT_GRPC_PORT}:6334
    volumes:
    - qdrant:/qdrant/storage
    - type: bind
      source: ${QDRANT_TLS_CERT_FILE:?Provision Qdrant TLS inputs outside source control}
      target: /run/qdrant/tls.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${QDRANT_TLS_KEY_FILE:?Provision Qdrant TLS inputs outside source control}
      target: /run/qdrant/tls.key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${QDRANT_CA_BUNDLE_FILE:?Provision Qdrant TLS inputs outside source control}
      target: /run/qdrant/ca-bundle.pem
      read_only: true
      bind:
        create_host_path: false
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - 'bash -o pipefail -ec ''printf "GET /healthz HTTP/1.1\r\nHost: qdrant\r\nConnection: close\r\n\r\n" | openssl s_client -quiet
        -ignore_unexpected_eof -connect 127.0.0.1:6333 -servername qdrant -verify_hostname qdrant -verify_return_error -CAfile /run/qdrant/ca-bundle.pem
        2>/dev/null | grep -q "healthz check passed"'''
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  object-store:
    cap_drop: *id001
    read_only: true
    security_opt: *id002
    pids_limit: 256
    user: 10001:10001
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
    - /logs:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0750
    networks:
    - data-object-store
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET_KEY}
    ports:
    - 127.0.0.1:${LOCAL_S3_PORT}:9000
    - 127.0.0.1:${LOCAL_S3_CONSOLE_PORT}:9001
    volumes:
    - object-store:/data
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/health
      interval: 5s
      timeout: 5s
      retries: 12
  agent-python-sandbox:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    - seccomp=../security/capability-worker-seccomp.json
    pids_limit: 256
    user: 10001:10001
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    image: ${AGENT_PYTHON_SANDBOX_IMAGE:?Select the admitted independent sandbox image}
    entrypoint:
    - ai-platform-python-sandbox
    command:
    - --public-key-id
    - ${AGENT_SANDBOX_PUBLIC_KEY_ID:?Select the sandbox-job verifier key id}
    - --public-key-hex
    - ${AGENT_SANDBOX_PUBLIC_KEY_HEX:?Select the purpose-specific Ed25519 public verifier}
    - --socket
    - /run/agentforge-sandbox/control.sock
    - --workspace-root
    - /workspace
    - --journal-root
    - /var/lib/agentforge-sandbox/jobs
    - --cgroup-root
    - /sys/fs/cgroup/agentforge-sandbox
    network_mode: none
    volumes:
    - sandbox-control-socket:/run/agentforge-sandbox
    - sandbox-private-workspaces:/workspace
    - sandbox-private-journal:/var/lib/agentforge-sandbox/jobs
    - type: bind
      source: ${AGENT_CAPABILITY_SANDBOX_CGROUP_DELEGATION:?Select this sandbox's predelegated empty cgroup2 subtree}
      target: /sys/fs/cgroup/agentforge-sandbox
      read_only: false
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - ai-platform-python-sandbox-health
      - /run/agentforge-sandbox/control.sock
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: ${AGENT_PYTHON_SANDBOX_MEMORY_LIMIT:-1536m}
    cpus: ${AGENT_PYTHON_SANDBOX_CPUS:-2.0}
    init: true
    restart: unless-stopped
  agent-capability-worker:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 10001:10001
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    networks:
    - app
    - data-postgres
    - data-object-store
    image: ${AGENT_CAPABILITY_WORKER_IMAGE:?Set the root-selected local capability-worker image}
    pull_policy: never
    expose:
    - '8095'
    ports:
    - 127.0.0.1:${AI_PLATFORM_CAPABILITY_WORKER_HOST_PORT:-8095}:8095
    environment:
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store
      http_proxy: ${CONTAINER_HTTP_PROXY:-}
      https_proxy: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      all_proxy: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      no_proxy: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store
      AI_PLATFORM_INTERNAL_TOKEN: ${AI_PLATFORM_INTERNAL_TOKEN:?AI_PLATFORM_INTERNAL_TOKEN is required}
      AI_PLATFORM_CAPABILITY_PROOF_SECRET: ${AI_PLATFORM_CAPABILITY_PROOF_SECRET:?AI_PLATFORM_CAPABILITY_PROOF_SECRET is required}
      AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET: ${AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET:?AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET
        is required}
      AI_PLATFORM_CAPABILITY_WORKER_BIND: 0.0.0.0:8095
      AI_PLATFORM_CAPABILITY_WORKER_FIXTURES_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_FIXTURES_ENABLED:-false}
      AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED:-true}
      AI_PLATFORM_OFFICE_FONT_PATHS: ${AI_PLATFORM_OFFICE_FONT_PATHS:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}
      AI_PLATFORM_KNOWLEDGE_SERVICE_URL: http://knowledge-service:8092
      AI_PLATFORM_GATEWAY_INTERNAL_URL: http://gateway:8080
      AI_PLATFORM_CAPABILITY_WORKSPACE_ROOT: /workspace
      AI_PLATFORM_SANDBOX_SOCKET: /run/agentforge-sandbox/control.sock
      AI_PLATFORM_SANDBOX_KEY_ID: ${AGENT_SANDBOX_PUBLIC_KEY_ID:?Select the sandbox-job verifier key id}
      AI_PLATFORM_SANDBOX_SIGNING_KEY_FILE: /run/agentforge-sandbox-signing/signing.seed
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}capability_worker
      POSTGRES_PASSWORD: ${LOCAL_DB_CAPABILITY_WORKER_PASSWORD:?LOCAL_DB_CAPABILITY_WORKER_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AI_PLATFORM_CAPABILITY_WORKER_DB_POOL_MAX_SIZE: ${AI_PLATFORM_CAPABILITY_WORKER_DB_POOL_MAX_SIZE:-4}
    volumes:
    - agent-capability-workspaces:/workspace
    - sandbox-control-socket:/run/agentforge-sandbox:ro
    - type: bind
      source: ${AGENT_SANDBOX_SIGNING_KEY_FILE:?Provision the purpose-specific control-only 32-byte seed}
      target: /run/agentforge-sandbox-signing/signing.seed
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      agent-python-sandbox:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      knowledge-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - ai-platform-capability-worker-health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${AGENT_CAPABILITY_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${AGENT_CAPABILITY_WORKER_CPUS:-1.0}
    init: true
  agent-runtime:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 10001:10001
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=1777
    - /workspace:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    networks:
    - app
    - data-postgres
    - data-object-store
    image: ${AI_PLATFORM_AGENT_RUNTIME_IMAGE:?Build and select the local Runtime image}
    pull_policy: never
    expose:
    - '8094'
    ports:
    - 127.0.0.1:${AI_PLATFORM_AGENT_RUNTIME_HOST_PORT:-8094}:8094
    environment:
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store
      http_proxy: ${CONTAINER_HTTP_PROXY:-}
      https_proxy: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      all_proxy: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      no_proxy: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store
      AI_PLATFORM_INTERNAL_TOKEN: ${AI_PLATFORM_INTERNAL_TOKEN:?AI_PLATFORM_INTERNAL_TOKEN is required}
      AI_PLATFORM_CAPABILITY_PLANE_URL: http://gateway:8080/internal/v2/agent-capabilities
      AI_PLATFORM_CAPABILITY_WORKER_URL: http://agent-capability-worker:8095
      AI_PLATFORM_CAPABILITY_WORKER_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_ENABLED:-true}
      AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED:-true}
      AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET: ${AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET:?AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET
        is required}
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN: ${AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN:?AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN
        is required}
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_RUNTIME_BASE_URL: http://gateway:8080/internal/v1/agent-model-plane
      AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION: ${AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION:?AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION
        is required}
      AI_PLATFORM_RUNTIME_BIND: 0.0.0.0:8094
      AI_PLATFORM_RUNTIME_WORKDIR: /workspace
      CODEX_HOME: /var/lib/ai-platform-agent-runtime/runtime-home
      AI_PLATFORM_AGENT_HOME: /var/lib/ai-platform-agent-runtime/runtime-home
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}runtime
      POSTGRES_PASSWORD: ${LOCAL_DB_RUNTIME_PASSWORD:?LOCAL_DB_RUNTIME_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AI_PLATFORM_RUNTIME_DB_POOL_MAX_SIZE: ${AI_PLATFORM_AGENT_RUNTIME_DB_POOL_MAX_SIZE:-10}
      AI_PLATFORM_RUNTIME_CHANNEL_CAPACITY: ${AI_PLATFORM_AGENT_RUNTIME_CHANNEL_CAPACITY:-256}
    volumes:
    - agent-runtime-home:/var/lib/ai-platform-agent-runtime/runtime-home
    depends_on:
      postgres:
        condition: service_healthy
      agent-capability-worker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8094/health/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${AI_PLATFORM_AGENT_RUNTIME_MEMORY_LIMIT:-512m}
    init: true
  database-bootstrap:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 1000:1000
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    image: ${MIGRATE_IMAGE:?Select the admitted native migration image}
    environment:
      AI_GATEWAY_ROLE_PREFIX: ${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}
      AI_GATEWAY_DATABASE_ADMIN_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}
      AI_GATEWAY_DATABASE_MIGRATOR_DSN: postgresql://${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}migrator:${LOCAL_DB_MIGRATOR_PASSWORD:?Run
        init-env for distinct scoped credentials}@postgres:5432/${POSTGRES_DB:-gateway}
      AI_GATEWAY_DATABASE_GATEWAY_DSN: postgresql://${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}gateway:${LOCAL_DB_GATEWAY_PASSWORD:?Run init-env
        for distinct scoped credentials}@postgres:5432/${POSTGRES_DB:-gateway}
      AI_GATEWAY_DATABASE_RUNTIME_DSN: postgresql://${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}runtime:${LOCAL_DB_RUNTIME_PASSWORD:?Run init-env
        for distinct scoped credentials}@postgres:5432/${POSTGRES_DB:-gateway}
      AI_GATEWAY_DATABASE_CAPABILITY_WORKER_DSN: postgresql://${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}capability_worker:${LOCAL_DB_CAPABILITY_WORKER_PASSWORD:?Run
        init-env for distinct scoped credentials}@postgres:5432/${POSTGRES_DB:-gateway}
      AI_GATEWAY_DATABASE_KNOWLEDGE_API_DSN: postgresql://${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}knowledge_api:${LOCAL_DB_KNOWLEDGE_API_PASSWORD:?Run
        init-env for distinct scoped credentials}@postgres:5432/${POSTGRES_DB:-gateway}
      AI_GATEWAY_DATABASE_KNOWLEDGE_WORKER_DSN: postgresql://${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}knowledge_worker:${LOCAL_DB_KNOWLEDGE_WORKER_PASSWORD:?Run
        init-env for distinct scoped credentials}@postgres:5432/${POSTGRES_DB:-gateway}
    entrypoint:
    - /usr/local/bin/database-authority
    command:
    - deployment-bootstrap
    - --expected-database
    - ${POSTGRES_DB:-gateway}
    - --expected-admin
    - ${POSTGRES_USER:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - data-postgres
    restart: 'no'
    pull_policy: never
  migrate:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 1000:1000
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    image: ${MIGRATE_IMAGE:?Select the admitted native migration image}
    environment:
      AI_GATEWAY_ROLE_PREFIX: ${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}
      AI_GATEWAY_DATABASE_MIGRATOR_DSN: postgresql://${AI_GATEWAY_ROLE_PREFIX:-ai_gateway_}migrator:${LOCAL_DB_MIGRATOR_PASSWORD:?Run
        init-env for distinct migrator credentials}@postgres:5432/${POSTGRES_DB:-gateway}
    entrypoint:
    - /usr/local/bin/database-authority
    command:
    - migrate
    depends_on:
      postgres:
        condition: service_healthy
      database-bootstrap:
        condition: service_completed_successfully
    networks:
    - data-postgres
    restart: 'no'
    pull_policy: never
  gateway-init:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 1000:1000
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    image: ${GATEWAY_IMAGE:?Select the admitted native Gateway image}
    command:
    - mkdir -p /app/data/images /app/logs /app/agent-memory && test -w /app/data && test -w /app/logs && test -w /app/agent-memory &&
      chmod 700 /app/agent-memory
    volumes:
    - gateway-logs:/app/logs
    - gateway-data:/app/data
    - assistant-memory-data:/app/agent-memory
    network_mode: none
    restart: 'no'
    pull_policy: never
    entrypoint:
    - /bin/sh
    - -ec
  gateway:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 1000:1000
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    image: ${GATEWAY_IMAGE:?Select the admitted native Gateway image}
    environment:
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store
      http_proxy: ${CONTAINER_HTTP_PROXY:-}
      https_proxy: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      all_proxy: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      no_proxy: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store
      GATEWAY_NATIVE_CONFIG: /app/config/native-gateway.json
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '8080'
      GATEWAY_TASK_WORKER_CONCURRENCY: ${GATEWAY_TASK_WORKER_CONCURRENCY:-1}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3.8-flash}
      MODEL_SETUP_MODE: ${MODEL_SETUP_MODE:-ui}
      GATEWAY_DATABASE__ENABLED: 'true'
      GATEWAY_DATABASE__POOL_MAX_SIZE: ${GATEWAY_DATABASE_POOL_MAX_SIZE:-10}
      GATEWAY_DATABASE__DSN: ${LOCAL_CONTAINER_GATEWAY_DSN:?Provide the scoped postgres:5432 Gateway DSN}
      GATEWAY_DATABASE__AUTO_INIT: 'false'
      GATEWAY_REDIS__ENABLED: 'true'
