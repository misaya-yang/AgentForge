# Fresh core: required workload mTLS, exact HTTPS BFF origin and independent HTTP health.
# Database-only projection remains independent of all application security/image inputs.
services:
  postgres:
    cap_drop: &id001
    - ALL
    read_only: true
    security_opt: &id002
    - no-new-privileges:true
    pids_limit: 256
    user: 70:70
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=1777
    networks:
    - data-postgres
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${LOCAL_FRESH_SOURCE_DATABASE:?Native prepare records original database}
      POSTGRES_PASSWORD_FILE: /run/data-tls/bootstrap-password
    ports:
    - 127.0.0.1:${POSTGRES_PORT}:5432
    volumes:
    - postgres:/var/lib/postgresql/data
    - fresh-postgres-tls:/run/data-tls:ro
    - fresh-postgres-socket:/var/run/postgresql
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
    command:
    - postgres
    - -c
    - ssl=on
    - -c
    - ssl_min_protocol_version=TLSv1.3
    - -c
    - ssl_cert_file=/run/data-tls/postgres.crt
    - -c
    - ssl_key_file=/run/data-tls/postgres.key
    - -c
    - ssl_ca_file=/run/data-tls/ca-bundle.pem
    - -c
    - hba_file=/run/data-tls/pg_hba.conf
    - -c
    - password_encryption=scram-sha-256
    depends_on:
      files-postgres:
        condition: service_completed_successfully
      files-socket:
        condition: service_completed_successfully
  redis:
    cap_drop: *id001
    read_only: true
    security_opt: *id002
    pids_limit: 256
    user: 999:1000
    tmpfs: &id003
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    networks:
    - data-redis
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: 128mb
    command:
    - /bin/sh
    - /opt/redis-entrypoint.sh
    ports:
    - 127.0.0.1:${REDIS_PORT}:6379
    volumes:
    - redis:/data
    - ./scripts/new/redis-entrypoint.sh:/opt/redis-entrypoint.sh:ro
    mem_limit: 192m
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    cap_drop: *id001
    read_only: true
    security_opt: *id002
    pids_limit: 256
    user: 1000:1000
    tmpfs: *id003
    networks:
    - data
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Provision the Qdrant writer key}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?Provision a distinct Qdrant read-only key}
      QDRANT__SERVICE__ENABLE_TLS: 'true'
      QDRANT__TLS__CERT: /run/qdrant/tls.crt
      QDRANT__TLS__KEY: /run/qdrant/tls.key
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__STORAGE__TEMP_PATH: /qdrant/storage/snapshots_temp
      QDRANT_INIT_FILE_PATH: /qdrant/storage/.qdrant-initialized
    ports:
    - 127.0.0.1:${QDRANT_HTTP_PORT}:6333
    - 127.0.0.1:${QDRANT_GRPC_PORT}:6334
    volumes:
    - qdrant-fresh:/qdrant/storage
    - qdrant-tls-private:/run/qdrant:ro
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - 'bash -o pipefail -ec ''printf "GET /healthz HTTP/1.1\r\nHost: qdrant\r\nConnection: close\r\n\r\n" | openssl s_client -quiet -ignore_unexpected_eof -connect 127.0.0.1:6333 -servername
        qdrant -verify_hostname qdrant -verify_return_error -CAfile /run/qdrant/ca-bundle.pem 2>/dev/null | grep -q "healthz check passed"'''
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      qdrant-files:
        condition: service_completed_successfully
      files-qdrant-storage:
        condition: service_completed_successfully
  object-store:
    cap_drop: *id001
    read_only: true
    security_opt: *id002
    pids_limit: 256
    user: 10001:10001
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
    - /logs:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0750
    networks:
    - data-object-store
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET_KEY}
    ports:
    - 127.0.0.1:${LOCAL_S3_PORT}:9000
    - 127.0.0.1:${LOCAL_S3_CONSOLE_PORT}:9001
    volumes:
    - object-store:/data
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/health
      interval: 5s
      timeout: 5s
      retries: 12
  agent-capability-worker:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 10001:10001
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    networks:
      app:
        aliases:
        - agent-capability-worker-workload
      data-postgres: {}
      data-object-store: {}
    image: ${AGENT_CAPABILITY_WORKER_IMAGE:?Set the root-selected local capability-worker image}
    pull_policy: never
    expose:
    - '8455'
    ports:
    - 127.0.0.1:${AI_PLATFORM_CAPABILITY_WORKER_HOST_PORT:-8095}:8095
    environment:
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store,gateway-workload,agent-runtime-workload,agent-capability-worker-workload,knowledge-service-workload,knowledge-worker-workload
      http_proxy: ${CONTAINER_HTTP_PROXY:-}
      https_proxy: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      all_proxy: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      no_proxy: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store,gateway-workload,agent-runtime-workload,agent-capability-worker-workload,knowledge-service-workload,knowledge-worker-workload
      AI_PLATFORM_CAPABILITY_WORKER_BIND: 0.0.0.0:8095
      AI_PLATFORM_CAPABILITY_WORKER_FIXTURES_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_FIXTURES_ENABLED:-false}
      AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED:-true}
      AI_PLATFORM_OFFICE_FONT_PATHS: ${AI_PLATFORM_OFFICE_FONT_PATHS:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}
      AI_PLATFORM_KNOWLEDGE_SERVICE_URL: https://knowledge-service-workload:8452
      AI_PLATFORM_GATEWAY_INTERNAL_URL: https://gateway-workload:8443
      AI_PLATFORM_CAPABILITY_WORKSPACE_ROOT: /workspace
      AI_PLATFORM_CAPABILITY_WORKER_DB_POOL_MAX_SIZE: ${AI_PLATFORM_CAPABILITY_WORKER_DB_POOL_MAX_SIZE:-4}
      DATA_CAPABILITY_WORKER_DSN_FILE: /run/data/credentials/dsn-control
      DATA_CAPABILITY_WORKER_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_CAPABILITY_WORKER_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_CAPABILITY_WORKER_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_CAPABILITY_WORKER_MODE: direct
      DATA_CAPABILITY_WORKER_EXPECTED_HOST: postgres
      DATA_CAPABILITY_WORKER_DATABASE_ALIAS: ${POSTGRES_DB:?Native preparation required}
      DATA_CAPABILITY_WORKER_PHYSICAL_DATABASE: ${POSTGRES_DB:?Native preparation required}
      DATA_CAPABILITY_WORKER_POOL_MAX: '4'
      DATA_CAPABILITY_WORKER_REPLICAS: '1'
      DATA_CAPABILITY_WORKER_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_CAPABILITY_WORKER_POOLED_BACKEND_LIMIT: '8'
      DATA_CAPABILITY_WORKER_STATEMENT_TIMEOUT_MS: '30000'
      AI_PLATFORM_LEASE_TRUST_MODE: verify_only
      AI_PLATFORM_BROKER_PROOF_MODE: verify_only
      AI_PLATFORM_LEASE_VERIFY_KEYRING_FILE: /run/model/gateway-public.json
      AI_PLATFORM_WORKLOAD_MTLS_MODE: required
      AI_PLATFORM_WORKLOAD_TLS_BIND: agent-capability-worker-workload:8455
      AI_PLATFORM_WORKLOAD_CREDENTIALS_DIR: /run/security/workload
      AI_PLATFORM_WORKLOAD_SPIFFE_ID: spiffe://agentforge.internal/service/agent-capability-worker
      AI_PLATFORM_WORKLOAD_ALLOWED_CLIENT_IDS: spiffe://agentforge.internal/service/gateway,spiffe://agentforge.internal/service/agent-runtime
      AI_PLATFORM_WORKLOAD_ALLOWED_ORIGINS: '{"https://gateway-workload:8443":"spiffe://agentforge.internal/service/gateway","https://knowledge-service-workload:8452":"spiffe://agentforge.internal/service/knowledge"}'
      AI_PLATFORM_WORKLOAD_PEERS_JSON: '{"https://gateway-workload:8443":"spiffe://agentforge.internal/service/gateway","https://knowledge-service-workload:8452":"spiffe://agentforge.internal/service/knowledge"}'
    volumes:
    - agent-capability-workspaces-fresh:/workspace
    - fresh-data-capability_worker:/run/data/credentials:ro
    - fresh-model-runtime:/run/model:ro
    - fresh-security-agent-capability-worker:/run/security:ro
    depends_on:
      postgres:
        condition: service_healthy
      gateway-init:
        condition: service_completed_successfully
      knowledge-service:
        condition: service_healthy
      database-fresh:
        condition: service_completed_successfully
      files-capability_worker:
        condition: service_completed_successfully
      files-model-runtime:
        condition: service_completed_successfully
      files-security-agent-capability-worker:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - ai-platform-capability-worker-health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${AGENT_CAPABILITY_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${AGENT_CAPABILITY_WORKER_CPUS:-1.0}
    init: true
    deploy:
      replicas: 1
    labels:
      io.agentforge.local.security-generation: ${LOCAL_FRESH_SECURITY_GENERATION:?Native secure-extend must complete first}
  agent-runtime:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 10001:10001
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=1777
    - /workspace:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    networks:
      app:
        aliases:
        - agent-runtime-workload
      data-postgres: {}
      data-object-store: {}
    image: ${AI_PLATFORM_AGENT_RUNTIME_IMAGE:?Build and select the local Runtime image}
    pull_policy: never
    expose:
    - '8454'
    ports:
    - 127.0.0.1:${AI_PLATFORM_AGENT_RUNTIME_HOST_PORT:-8094}:8094
    environment:
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store,gateway-workload,agent-runtime-workload,agent-capability-worker-workload,knowledge-service-workload,knowledge-worker-workload
      http_proxy: ${CONTAINER_HTTP_PROXY:-}
      https_proxy: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      all_proxy: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      no_proxy: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store,gateway-workload,agent-runtime-workload,agent-capability-worker-workload,knowledge-service-workload,knowledge-worker-workload
      AI_PLATFORM_CAPABILITY_PLANE_URL: https://gateway-workload:8443/internal/v2/agent-capabilities
      AI_PLATFORM_CAPABILITY_WORKER_URL: https://agent-capability-worker-workload:8455
      AI_PLATFORM_CAPABILITY_WORKER_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_ENABLED:-true}
      AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED: ${AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED:-true}
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_RUNTIME_BASE_URL: https://gateway-workload:8443/internal/v1/agent-model-plane
      AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION: ${AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION:?AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION is required}
      AI_PLATFORM_RUNTIME_BIND: 0.0.0.0:8094
      AI_PLATFORM_RUNTIME_WORKDIR: /workspace
      CODEX_HOME: /var/lib/ai-platform-agent-runtime/runtime-home
      AI_PLATFORM_AGENT_HOME: /var/lib/ai-platform-agent-runtime/runtime-home
      AI_PLATFORM_RUNTIME_DB_POOL_MAX_SIZE: ${AI_PLATFORM_AGENT_RUNTIME_DB_POOL_MAX_SIZE:-10}
      AI_PLATFORM_RUNTIME_CHANNEL_CAPACITY: ${AI_PLATFORM_AGENT_RUNTIME_CHANNEL_CAPACITY:-256}
      DATA_RUNTIME_DSN_FILE: /run/data/credentials/dsn-control
      DATA_RUNTIME_TLS_CA_FILE: /run/data/credentials/ca-bundle.pem
      DATA_RUNTIME_TLS_CERT_FILE: /run/data/credentials/tls.crt
      DATA_RUNTIME_TLS_KEY_FILE: /run/data/credentials/tls.key
      DATA_RUNTIME_MODE: direct
      DATA_RUNTIME_EXPECTED_HOST: postgres
      DATA_RUNTIME_DATABASE_ALIAS: ${POSTGRES_DB:?Native preparation required}
      DATA_RUNTIME_PHYSICAL_DATABASE: ${POSTGRES_DB:?Native preparation required}
      DATA_RUNTIME_POOL_MAX: '4'
      DATA_RUNTIME_REPLICAS: '1'
      DATA_RUNTIME_ROLE_CONNECTION_LIMIT: ${DATA_ROLE_CONNECTION_LIMIT:-64}
      DATA_RUNTIME_POOLED_BACKEND_LIMIT: '8'
      DATA_RUNTIME_STATEMENT_TIMEOUT_MS: '30000'
      AI_PLATFORM_LEASE_TRUST_MODE: verify_only
      AI_PLATFORM_BROKER_PROOF_MODE: verify_only
      AI_PLATFORM_LEASE_VERIFY_KEYRING_FILE: /run/model/gateway-public.json
      AI_PLATFORM_WORKLOAD_MTLS_MODE: required
      AI_PLATFORM_WORKLOAD_TLS_BIND: agent-runtime-workload:8454
      AI_PLATFORM_WORKLOAD_CREDENTIALS_DIR: /run/security/workload
      AI_PLATFORM_WORKLOAD_SPIFFE_ID: spiffe://agentforge.internal/service/agent-runtime
      AI_PLATFORM_WORKLOAD_ALLOWED_CLIENT_IDS: spiffe://agentforge.internal/service/gateway
      AI_PLATFORM_WORKLOAD_ALLOWED_ORIGINS: '{"https://gateway-workload:8443":"spiffe://agentforge.internal/service/gateway","https://agent-capability-worker-workload:8455":"spiffe://agentforge.internal/service/agent-capability-worker","https://knowledge-service-workload:8452":"spiffe://agentforge.internal/service/knowledge"}'
      AI_PLATFORM_WORKLOAD_PEERS_JSON: '{"https://gateway-workload:8443":"spiffe://agentforge.internal/service/gateway","https://agent-capability-worker-workload:8455":"spiffe://agentforge.internal/service/agent-capability-worker","https://knowledge-service-workload:8452":"spiffe://agentforge.internal/service/knowledge"}'
      AI_PLATFORM_RUNTIME_MODEL_PROXY_BASE_URL: http://127.0.0.1:8094/internal/v1/model-proxy
      AI_PLATFORM_GATEWAY_INTERNAL_URL: https://gateway-workload:8443
      AI_PLATFORM_KNOWLEDGE_SERVICE_URL: https://knowledge-service-workload:8452
    volumes:
    - agent-runtime-home-fresh:/var/lib/ai-platform-agent-runtime/runtime-home
    - fresh-data-runtime:/run/data/credentials:ro
    - fresh-model-runtime:/run/model:ro
    - fresh-security-agent-runtime:/run/security:ro
    depends_on:
      postgres:
        condition: service_healthy
      agent-capability-worker:
        condition: service_healthy
      database-fresh:
        condition: service_completed_successfully
      files-runtime:
        condition: service_completed_successfully
      files-model-runtime:
        condition: service_completed_successfully
      files-security-agent-runtime:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8094/health/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${AI_PLATFORM_AGENT_RUNTIME_MEMORY_LIMIT:-512m}
    init: true
    deploy:
      replicas: 1
    env_file:
    - ${LOCAL_FRESH_RUNTIME_BRIDGE_ENV_FILE:?Native secure-extend must complete first}
    labels:
      io.agentforge.local.security-generation: ${LOCAL_FRESH_SECURITY_GENERATION:?Native secure-extend must complete first}
  gateway-init:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 1000:1000
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    image: ${GATEWAY_IMAGE:?Select the admitted native Gateway image}
    command:
    - mkdir -p /app/data/images /app/logs /app/agent-memory && test -w /app/data && test -w /app/logs && test -w /app/agent-memory && chmod 700 /app/agent-memory
    volumes:
    - gateway-logs-fresh:/app/logs
    - gateway-data-fresh:/app/data
    - assistant-memory-data-fresh:/app/agent-memory
    network_mode: none
    restart: 'no'
    pull_policy: never
    entrypoint:
    - /bin/sh
    - -ec
    mem_limit: 96m
  gateway:
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    user: 1000:1000
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    image: ${GATEWAY_IMAGE:?Select the admitted native Gateway image}
    environment:
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store,gateway-workload,agent-runtime-workload,agent-capability-worker-workload,knowledge-service-workload,knowledge-worker-workload
      http_proxy: ${CONTAINER_HTTP_PROXY:-}
      https_proxy: ${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      all_proxy: ${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}
      no_proxy: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1},gateway,knowledge-service,knowledge-worker,agent-runtime,agent-capability-worker,postgres,redis,qdrant,object-store,gateway-workload,agent-runtime-workload,agent-capability-worker-workload,knowledge-service-workload,knowledge-worker-workload
      GATEWAY_NATIVE_CONFIG: /app/config/native-gateway.json
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '8080'
      GATEWAY_TASK_WORKER_CONCURRENCY: ${GATEWAY_TASK_WORKER_CONCURRENCY:-1}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3.8-flash}
      MODEL_SETUP_MODE: ${MODEL_SETUP_MODE:-ui}
      GATEWAY_DATABASE__ENABLED: 'true'
      GATEWAY_DATABASE__POOL_MAX_SIZE: ${GATEWAY_DATABASE_POOL_MAX_SIZE:-10}
      GATEWAY_DATABASE__AUTO_INIT: 'false'
      GATEWAY_REDIS__ENABLED: 'true'
      GATEWAY_REDIS__URL: redis://:${REDIS_PASSWORD:?Reuse the existing Redis credential}@redis:6379/11
      GATEWAY_AUTHENTICATION__JWT__ENABLED: 'true'
      GATEWAY_AUTHENTICATION__JWT__ALGORITHMS: '["HS256"]'
      GATEWAY_AUTHENTICATION__API_KEY__ENABLED: ${GATEWAY_AUTHENTICATION__API_KEY__ENABLED:-false}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN:-example.com}
      CONSOLE_PUBLIC_BASE_URL: ${LOCAL_FRESH_CONSOLE_ORIGIN:?Native secure-extend must complete first}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?DEFAULT_USER_PASSWORD is required}
      RATE_LIMIT_IP_ENABLED: ${RATE_LIMIT_IP_ENABLED:-true}
      RATE_LIMIT_IP_LIMIT: ${RATE_LIMIT_IP_LIMIT:-500}
      RATE_LIMIT_ANONYMOUS_LIMIT: ${RATE_LIMIT_ANONYMOUS_LIMIT:-200}
      RATE_LIMIT_NORMAL_LIMIT: ${RATE_LIMIT_NORMAL_LIMIT:-300}
      RATE_LIMIT_PREMIUM_LIMIT: ${RATE_LIMIT_PREMIUM_LIMIT:-1000}
      RATE_LIMIT_ENTERPRISE_LIMIT: ${RATE_LIMIT_ENTERPRISE_LIMIT:-5000}
      RATE_LIMIT_ADMIN_LIMIT: ${RATE_LIMIT_ADMIN_LIMIT:-10000}
      RATE_LIMIT_ASSISTANT_CHAT_LIMIT: ${RATE_LIMIT_ASSISTANT_CHAT_LIMIT:-240}
      GATEWAY_LANGGRAPH__ENABLED: ${GATEWAY_LANGGRAPH__ENABLED:-false}
      GATEWAY_LANGGRAPH__INSTANCE_URLS: ${GATEWAY_LANGGRAPH__INSTANCE_URLS:-}
      GATEWAY_LANGGRAPH__AUTH_TOKEN: ${GATEWAY_LANGGRAPH__AUTH_TOKEN:-}
