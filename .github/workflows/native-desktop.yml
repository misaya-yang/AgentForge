name: Native Desktop Candidates

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'rust/platform-native/Cargo.toml'
      - 'rust/platform-native/Cargo.lock'
      - 'rust/platform-native/rust-toolchain.toml'
      - 'rust/platform-native/README.md'
      - 'rust/platform-native/crates/*/Cargo.toml'
      - 'rust/platform-native/crates/platform-client/**'
      - 'rust/platform-native/crates/platform-desktop/**'
      - 'rust/platform-native/crates/platform-tools/src/packaging.rs'
      - 'rust/platform-native/crates/platform-client-packaging/**'
      - '.github/actions/setup-client-packaging/**'
      - 'rust/platform-native/crates/platform-tools/src/main.rs'
      - 'deploy/release/desktop-targets.json'
      - 'docs/architecture/native-desktop-distribution.md'
      - 'docs/architecture/native-client-capability-matrix.md'
      - '.github/workflows/native-desktop.yml'
      - 'LICENSE'
      - 'RELEASE.md'

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    name: Resolve desktop candidate targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-client-packaging
      - name: Read canonical desktop target manifest
        id: targets
        run: echo "matrix=$(platform-client-packaging package-desktop --matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Build desktop (${{ matrix.name }})
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      PACKAGE_TARGET: ${{ matrix.name }}
      RUST_TARGET: ${{ matrix.rust_target }}
      PACKAGE_BINARY: ${{ matrix.binary }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Select external desktop target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/desktop-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-client-packaging
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; explicit toolchain below
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust_target }}
      - name: Install Linux native window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - name: Bind build to clean source identity and platform options
        run: platform-client-packaging package-desktop --build-env --target "$PACKAGE_TARGET" >> "$GITHUB_ENV"
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Build only the desktop binary
        run: >-
          cargo build --locked --release
          --manifest-path rust/platform-native/Cargo.toml
          -p ai-platform-desktop --bin ai-platform-desktop
          --target "$RUST_TARGET"
      - name: Package and verify extracted offline executable identity
        run: >-
          platform-client-packaging package-desktop
          --target "$PACKAGE_TARGET"
          --binary "$CARGO_TARGET_DIR/$RUST_TARGET/release/$PACKAGE_BINARY"
          --output "$RUNNER_TEMP/desktop-package"
      - name: Upload unsigned desktop candidates and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-platform-desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/desktop-package/*
          if-no-files-found: error
          retention-days: 30

  candidate-results:
    name: Require every desktop candidate build
    if: always()
    needs: [targets, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a target failed or was skipped
        env:
          TARGETS_RESULT: ${{ needs.targets.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$TARGETS_RESULT" = success && test "$BUILD_RESULT" = success
