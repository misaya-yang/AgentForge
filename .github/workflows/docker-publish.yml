# =============================================================================
# Docker Build & Push to GHCR
# =============================================================================
# Triggers on version tags (v*). Builds every shipped Dockerfile for amd64 and
# arm64, then publishes matching immutable release tags:
#   - ghcr.io/<owner>/ai-gateway
#   - ghcr.io/<owner>/ai-gateway-web
#   - ghcr.io/<owner>/ai-gateway-knowledge-service
#   - ghcr.io/<owner>/ai-gateway-migrate
#   - ghcr.io/<owner>/ai-gateway-code-interpreter
# =============================================================================

name: Docker Publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ai-gateway
            context: .
            dockerfile: Dockerfile
          - image: ai-gateway-web
            context: ./web
            dockerfile: ./web/Dockerfile
          - image: ai-gateway-knowledge-service
            context: .
            dockerfile: ./apps/knowledge-service/Dockerfile
          - image: ai-gateway-migrate
            context: .
            dockerfile: ./docker/migrate/Dockerfile
          - image: ai-gateway-code-interpreter
            context: ./docker/code-interpreter
            dockerfile: ./docker/code-interpreter/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
