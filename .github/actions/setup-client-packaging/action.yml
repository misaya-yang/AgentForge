name: Set up portable native client packaging
description: Build only cross-platform Rust packaging tools, without Unix service operations
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.99.0
    - name: Configure bounded external packaging build
      shell: bash
      run: |
        target_dir="${CARGO_TARGET_DIR:-$RUNNER_TEMP/platform-client-packaging-target}"
        echo 'CARGO_BUILD_JOBS=1' >> "$GITHUB_ENV"
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
        echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
        echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
        echo "$target_dir/debug" >> "$GITHUB_PATH"
    - name: Build portable packaging command
      shell: bash
      run: >-
        cargo build --locked --manifest-path rust/platform-native/Cargo.toml
        -p ai-platform-client-packaging --bin platform-client-packaging
