name: Set up native Rust tools
description: Install the pinned Rust toolchain and source-built operational commands
inputs:
  capacity-profile:
    description: single by default; hosted opts standard GitHub Linux runners into bounded parallelism
    default: single
  packages:
    description: Space-separated native operational packages to build
    default: ai-platform-tools ai-platform-openapi ai-platform-config-loader ai-platform-release ai-platform-eval ai-platform-migration-authority
  nextest:
    description: Install the pinned nextest runner for the changed-crate gate
    default: 'false'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.99.0
    - name: Install pinned Rust compiler cache
      uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.18.0
    - name: Install pinned nextest
      if: inputs.nextest == 'true'
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-nextest@0.9.148
        fallback: none
    - name: Configure bounded external builds
      shell: bash
      env:
        AI_PLATFORM_CI_CAPACITY_PROFILE: ${{ inputs.capacity-profile }}
      run: |
        [[ "$AI_PLATFORM_CI_CAPACITY_PROFILE" == single || "$AI_PLATFORM_CI_CAPACITY_PROFILE" == hosted ]] || exit 1
        rustc --edition=2024 rust/platform-native/crates/platform-tools/src/ci_capacity_bootstrap.rs -o "$RUNNER_TEMP/ci-capacity"
        "$RUNNER_TEMP/ci-capacity" >> "$GITHUB_ENV"
        echo "AI_PLATFORM_CI_CAPACITY_PROFILE=$AI_PLATFORM_CI_CAPACITY_PROFILE" >> "$GITHUB_ENV"
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
        echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
        echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/platform-native-target" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/platform-native-target/debug" >> "$GITHUB_PATH"
        echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
        echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
        echo 'SCCACHE_CACHE_SIZE=2G' >> "$GITHUB_ENV"
    - name: Build native operational tools
      shell: bash
      env:
        NATIVE_PACKAGES: ${{ inputs.packages }}
        AI_PLATFORM_CI_CAPACITY_PROFILE: ${{ inputs.capacity-profile }}
      run: |
        args=()
        read -r -a packages <<< "$NATIVE_PACKAGES"
        for package in "${packages[@]}"; do
          [[ "$package" =~ ^ai-platform-[a-z0-9-]+$ ]] || exit 1
          args+=(-p "$package")
        done
        test "${#args[@]}" -gt 0
        CARGO_BUILD_JOBS="$("$RUNNER_TEMP/ci-capacity" --build-jobs)" \
          cargo build --locked --manifest-path rust/platform-native/Cargo.toml "${args[@]}" --bins
    - name: Record observed capacity
      shell: bash
      run: platform-tools ci-capacity --evidence-out tmp/gate-evidence/ci-capacity.json
