name: Set up native Rust tools
description: Install the pinned Rust toolchain and source-built operational commands
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.99.0
    - name: Configure bounded external builds
      shell: bash
      run: |
        echo 'CARGO_BUILD_JOBS=1' >> "$GITHUB_ENV"
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
        echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
        echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/platform-native-target" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/platform-native-target/debug" >> "$GITHUB_PATH"
    - name: Build native operational tools
      shell: bash
      run: >-
        cargo build --locked --manifest-path rust/platform-native/Cargo.toml
        -p ai-platform-tools -p ai-platform-openapi -p ai-platform-config-loader
        -p ai-platform-release -p ai-platform-eval -p ai-platform-migration-authority --bins
