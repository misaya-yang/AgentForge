# =============================================================================
# AI Gateway - Production Docker Compose
# =============================================================================
# Default usage pulls published, versioned multi-architecture images. Source
# builds are opt-in through docker-compose.build.yml (or `make quickstart-build`).
# Usage:
#   Start all services:  docker compose --env-file .env up -d
#   Build from source:   docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env up -d --build
#   Infrastructure only: docker compose --env-file .env up -d postgres redis qdrant
#   View logs:           docker compose --env-file .env logs -f gateway
#   Stop services:       docker compose --env-file .env stop
# =============================================================================

name: ai-gateway

x-container-proxy-env: &container-proxy-env
  HTTP_PROXY: "${CONTAINER_HTTP_PROXY:-}"
  HTTPS_PROXY: "${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}"
  ALL_PROXY: "${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}"
  NO_PROXY: "${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1,postgres,redis,qdrant,gateway,frontend,knowledge-service,agent-runtime,agent-capability-worker}"
  http_proxy: "${CONTAINER_HTTP_PROXY:-}"
  https_proxy: "${CONTAINER_HTTPS_PROXY:-${CONTAINER_HTTP_PROXY:-}}"
  all_proxy: "${CONTAINER_ALL_PROXY:-${CONTAINER_HTTP_PROXY:-}}"
  no_proxy: "${CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1,postgres,redis,qdrant,gateway,frontend,knowledge-service,agent-runtime,agent-capability-worker}"

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  # PostgreSQL - Primary Database
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    container_name: ai-gateway-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Schema bootstrap is owned exclusively by the one-shot migrate service.
      # Never mount schema.sql into docker-entrypoint-initdb.d: that bypasses
      # the authority ledger, fingerprints, roles and recovery contract.
    networks:
      - ai-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-320m}"

  # Redis - Cache & Session Store
  redis:
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    container_name: ai-gateway-redis
    environment:
      # Pass password to container for healthcheck access
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAXMEMORY: "${REDIS_MAXMEMORY:-128mb}"
    command:
      - /bin/sh
      - /opt/ai-gateway/redis-entrypoint.sh
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./scripts/new/redis-entrypoint.sh:/opt/ai-gateway/redis-entrypoint.sh:ro
      - redis-data:/data
    networks:
      - ai-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: "${REDIS_MEMORY_LIMIT:-192m}"

  # Qdrant - Vector Database for Knowledge Base
  qdrant:
    image: "${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}"
    container_name: ai-gateway-qdrant
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ai-gateway-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"healthz check passed\" <&3'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: "${QDRANT_MEMORY_LIMIT:-352m}"

  # ===========================================================================
  # Migration Job — single schema authority
  # ===========================================================================
  # Every application service waits for this one-shot job. The command is
  # explicit so a stale image that lacks database.authority fails instead of
  # silently falling back to a historical per-service writer.
  migrate:
    image: "${MIGRATE_IMAGE:-ghcr.io/misaya-yang/ai-gateway-migrate:2.0.0}"
    container_name: ai-gateway-migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}"
      # Explicit authority input. Local Compose may reuse the bootstrap
      # credential during the pending-baseline compatibility epoch; managed
      # deployments override this with the dedicated migrator DSN.
      AI_GATEWAY_DATABASE_MIGRATOR_DSN: "${AI_GATEWAY_DATABASE_MIGRATOR_DSN:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}}"
    entrypoint: ["python", "-m", "database.authority"]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-gateway-net
    restart: "no"

  # ===========================================================================
  # Tracing Backend (Phase 6, local dev only)
  # ===========================================================================
  # Grafana Tempo single-binary mode. Apps export OTLP → tempo:4317; query
  # via http://localhost:3200. NOT included in prod compose unless the
  # operator opts in — prod sends to whatever OTLP endpoint
  # OTEL_EXPORTER_OTLP_ENDPOINT names.
  tempo:
    image: "${TEMPO_IMAGE:-grafana/tempo:2.5.0}"
    container_name: ai-gateway-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP query
      - "127.0.0.1:4317:4317"   # OTLP gRPC ingest
    networks:
      - ai-gateway-net
    restart: unless-stopped
    profiles:
      - tracing  # opt-in: `docker compose --profile tracing up -d tempo`

  # ===========================================================================
  # Application Services
  # ===========================================================================

  # One-shot volume permission initializer. Named volumes hide the permissions
  # baked into the image, so this must run before the non-root gateway process.
  gateway-init:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    container_name: ai-gateway-init
    user: "0:0"
    command: >
      sh -ec
      "mkdir -p /app/data/images /app/logs /app/agent-memory &&
       chown -R 1000:1000 /app/data /app/logs /app/agent-memory &&
       chmod 700 /app/agent-memory"
    volumes:
      - gateway-logs:/app/logs
      - gateway-data:/app/data
      # Keep the existing volume identity so pre-cutover memory remains
      # reachable for governed deletion; only the owning service/path changes.
      - assistant-memory-data:/app/agent-memory
    networks:
      - ai-gateway-net
    restart: "no"

  # AI Gateway Backend
  gateway:
    image: "${GATEWAY_IMAGE:-ghcr.io/misaya-yang/ai-gateway:2.0.0}"
    container_name: ai-gateway-backend
    environment:
      <<: *container-proxy-env
      # Server
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_TASK_WORKER_CONCURRENCY: "${GATEWAY_TASK_WORKER_CONCURRENCY:-1}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-qwen3.8-flash}"
      MODEL_SETUP_MODE: "${MODEL_SETUP_MODE:-ui}"

      # Database
      GATEWAY_DATABASE__ENABLED: "true"
      GATEWAY_DATABASE__DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}?options=-csearch_path%3Dgateway%2Cassistant%2Cknowledge%2Cpublic"
      # Application processes never execute DDL; migrate owns schema changes.
      GATEWAY_DATABASE__AUTO_INIT: "false"

      # Redis
      GATEWAY_REDIS__ENABLED: "true"
      GATEWAY_REDIS__URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"

      # Authentication
      GATEWAY_AUTHENTICATION__JWT__ENABLED: "true"
      GATEWAY_AUTHENTICATION__JWT__SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      GATEWAY_AUTHENTICATION__JWT__ALGORITHMS: '["HS256"]'
      GATEWAY_AUTHENTICATION__API_KEY__ENABLED: "${GATEWAY_AUTHENTICATION__API_KEY__ENABLED:-false}"
      AUTH_ALLOWED_EMAIL_DOMAIN: "${AUTH_ALLOWED_EMAIL_DOMAIN:-example.com}"
      CONSOLE_PUBLIC_BASE_URL: "${CONSOLE_PUBLIC_BASE_URL:-}"
      DEFAULT_USER_PASSWORD: "${DEFAULT_USER_PASSWORD:?DEFAULT_USER_PASSWORD is required}"

      # Local quickstart rate limits. Keep configurable so production can
      # tighten these values without code changes.
      RATE_LIMIT_IP_ENABLED: "${RATE_LIMIT_IP_ENABLED:-true}"
      RATE_LIMIT_IP_LIMIT: "${RATE_LIMIT_IP_LIMIT:-500}"
      RATE_LIMIT_ANONYMOUS_LIMIT: "${RATE_LIMIT_ANONYMOUS_LIMIT:-200}"
      RATE_LIMIT_NORMAL_LIMIT: "${RATE_LIMIT_NORMAL_LIMIT:-300}"
      RATE_LIMIT_PREMIUM_LIMIT: "${RATE_LIMIT_PREMIUM_LIMIT:-1000}"
      RATE_LIMIT_ENTERPRISE_LIMIT: "${RATE_LIMIT_ENTERPRISE_LIMIT:-5000}"
      RATE_LIMIT_ADMIN_LIMIT: "${RATE_LIMIT_ADMIN_LIMIT:-10000}"
      RATE_LIMIT_ASSISTANT_CHAT_LIMIT: "${RATE_LIMIT_ASSISTANT_CHAT_LIMIT:-240}"

      # LangGraph (optional)
      GATEWAY_LANGGRAPH__ENABLED: "${GATEWAY_LANGGRAPH__ENABLED:-false}"
      GATEWAY_LANGGRAPH__INSTANCE_URLS: "${GATEWAY_LANGGRAPH__INSTANCE_URLS:-}"
      GATEWAY_LANGGRAPH__AUTH_TOKEN: "${GATEWAY_LANGGRAPH__AUTH_TOKEN:-}"

      # Knowledge Base
      GATEWAY_KNOWLEDGE__ENABLED: "true"
      GATEWAY_KNOWLEDGE__WORKER_CONCURRENCY: "${GATEWAY_KNOWLEDGE__WORKER_CONCURRENCY:-2}"
      GATEWAY_KNOWLEDGE__QDRANT__ENABLED: "true"
      GATEWAY_KNOWLEDGE__QDRANT__URL: "http://qdrant:6333"

      # Embeddings API (DashScope / Gemini)
      GATEWAY_KNOWLEDGE__DASHSCOPE__API_KEY: "${DASHSCOPE_EMBEDDING_API_KEY:-${DASHSCOPE_API_KEY:-}}"

      # LLM provider keys (Gateway chat path). Separate chat-specific overrides route chat to free Intl
      # endpoint without affecting image_gen / embedding.
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_CHAT_API_KEY: "${DASHSCOPE_CHAT_API_KEY:-}"
      DASHSCOPE_IMAGE_API_KEY: "${DASHSCOPE_IMAGE_API_KEY:-}"
      DASHSCOPE_EMBEDDING_API_KEY: "${DASHSCOPE_EMBEDDING_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      DASHSCOPE_CHAT_BASE_URL: "${DASHSCOPE_CHAT_BASE_URL:-}"
      DASHSCOPE_CHAT_WIRE_PROTOCOL: "${DASHSCOPE_CHAT_WIRE_PROTOCOL:-responses_v1}"
      DASHSCOPE_EMBEDDING_BASE_URL: "${DASHSCOPE_EMBEDDING_BASE_URL:-}"
      DASHSCOPE_IMAGE_BASE_URL: "${DASHSCOPE_IMAGE_BASE_URL:-}"
      DASHSCOPE_IMAGE_MODEL: "${DASHSCOPE_IMAGE_MODEL:-wan2.6-t2i}"
      DASHSCOPE_IMAGE_PROTOCOL: "${DASHSCOPE_IMAGE_PROTOCOL:-wan26}"
      DASHSCOPE_IMAGE_SUBMIT_PATH: "${DASHSCOPE_IMAGE_SUBMIT_PATH:-/services/aigc/image-generation/generation}"
      IMAGE_GENERATION_PROVIDER: "${IMAGE_GENERATION_PROVIDER:-}"
      IMAGE_GENERATION_RESULT_HOST_SUFFIXES: "${IMAGE_GENERATION_RESULT_HOST_SUFFIXES:-aliyuncs.com,alibabacloud.com,volces.com}"
      DASHSCOPE_RERANK_BASE_URL: "${DASHSCOPE_RERANK_BASE_URL:-}"
      DASHSCOPE_RERANK_REQUEST_SCHEMA: "${DASHSCOPE_RERANK_REQUEST_SCHEMA:-auto}"
      DASHSCOPE_RERANK_INSTRUCT: "${DASHSCOPE_RERANK_INSTRUCT:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_API_BACKEND: "${GOOGLE_API_BACKEND:-}"
      GOOGLE_CHAT_BACKEND: "${GOOGLE_CHAT_BACKEND:-}"
      GOOGLE_IMAGE_BACKEND: "${GOOGLE_IMAGE_BACKEND:-}"
      GOOGLE_IMAGE_MODEL: "${GOOGLE_IMAGE_MODEL:-gemini-3.1-flash-image-preview}"
      VERTEX_API_KEY: "${VERTEX_API_KEY:-}"
      VERTEX_CHAT_API_KEY: "${VERTEX_CHAT_API_KEY:-}"
      VERTEX_IMAGE_API_KEY: "${VERTEX_IMAGE_API_KEY:-}"
      ARK_API_KEY: "${ARK_API_KEY:-}"
      ARK_BASE_URL: "${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      DOUBAO_IMAGE_MODEL: "${DOUBAO_IMAGE_MODEL:-doubao-seedream-5-0-260128}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_WIRE_PROTOCOL: "${OPENAI_WIRE_PROTOCOL:-chat_completions}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"

      # Proxy
      GATEWAY_PROXY__ENABLED: "true"
      GATEWAY_PROXY__BILLING_ENABLED: "${PROXY_BILLING_ENABLED:-false}"

      AI_PLATFORM_INTERNAL_TOKEN: "${AI_PLATFORM_INTERNAL_TOKEN:?AI_PLATFORM_INTERNAL_TOKEN is required}"
      AI_PLATFORM_CAPABILITY_PROOF_SECRET: "${AI_PLATFORM_CAPABILITY_PROOF_SECRET:?AI_PLATFORM_CAPABILITY_PROOF_SECRET is required}"
      AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET: "${AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET:?AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET is required}"
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN: "${AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN:-}"
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_RUNTIME_BASE_URL: "${AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_RUNTIME_BASE_URL:-http://gateway:8080/internal/v1/agent-model-plane}"
      AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION: "${AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION:-}"
      AI_PLATFORM_AGENT_RUNTIME_URL: "${AI_PLATFORM_AGENT_RUNTIME_URL:-http://agent-runtime:8094}"
      AI_PLATFORM_CAPABILITY_WORKER_URL: "${AI_PLATFORM_CAPABILITY_WORKER_URL:-http://agent-capability-worker:8095}"
      AI_PLATFORM_COMPATIBILITY_MANIFEST_PATH: "/app/deploy/release/compatibility-manifest.json"
      AI_PLATFORM_RELEASE_ID: "${AI_PLATFORM_RELEASE_ID:-}"
      AI_PLATFORM_GIT_SHA: "${VCS_REF:-}"
      AI_PLATFORM_IMAGE_DIGEST: "${GATEWAY_IMAGE_DIGEST:-}"
      AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED: "${AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED:-true}"
      AI_PLATFORM_CAPABILITY_WORKER_ENABLED: "${AI_PLATFORM_CAPABILITY_WORKER_ENABLED:-true}"
      AGENT_RUNTIME_MEMORY_DIR: "${AGENT_RUNTIME_MEMORY_DIR:-/app/agent-memory}"
      AGENT_STUDIO_RUNTIME_ENABLED: "${AGENT_STUDIO_RUNTIME_ENABLED:-true}"
      AGENT_STUDIO_MANAGEMENT_ENABLED: "${AGENT_STUDIO_MANAGEMENT_ENABLED:-true}"
      AGENT_STUDIO_PUBLISH_ENABLED: "${AGENT_STUDIO_PUBLISH_ENABLED:-true}"
      AGENT_STUDIO_MCP_ENABLED: "${AGENT_STUDIO_MCP_ENABLED:-true}"
      AGENT_STUDIO_SKILLS_ENABLED: "${AGENT_STUDIO_SKILLS_ENABLED:-true}"
      ASSISTANT_E2E_STUB_LLM: "${ASSISTANT_E2E_STUB_LLM:-false}"
      KB_SERVICE_URL: "${KB_SERVICE_URL:-http://knowledge-service:8092}"
      KB_PROXY_CONNECT_TIMEOUT_SECONDS: "${KB_PROXY_CONNECT_TIMEOUT_SECONDS:-5}"
      KB_PROXY_READ_TIMEOUT_SECONDS: "${KB_PROXY_READ_TIMEOUT_SECONDS:-30}"
      KB_PROXY_WRITE_TIMEOUT_SECONDS: "${KB_PROXY_WRITE_TIMEOUT_SECONDS:-10}"
      KB_PROXY_POOL_TIMEOUT_SECONDS: "${KB_PROXY_POOL_TIMEOUT_SECONDS:-10}"
      KB_PROXY_MAX_CONNECTIONS: "${KB_PROXY_MAX_CONNECTIONS:-50}"
      KB_PROXY_MAX_KEEPALIVE_CONNECTIONS: "${KB_PROXY_MAX_KEEPALIVE_CONNECTIONS:-10}"
      GATEWAY_ENCRYPTION_KEY: "${GATEWAY_ENCRYPTION_KEY:?GATEWAY_ENCRYPTION_KEY is required}"
      INTERNAL_COMM_STATE_BACKEND: "${INTERNAL_COMM_STATE_BACKEND:-redis}"
      INTERNAL_COMM_REDIS_URL: "${INTERNAL_COMM_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/3}"
      INTERNAL_AUTH_VERSION: "${INTERNAL_AUTH_VERSION:-v2}"
      INTERNAL_AUTH_ACTIVE_KEY_ID: "${INTERNAL_AUTH_ACTIVE_KEY_ID:-local}"
      INTERNAL_AUTH_KEYS: "${INTERNAL_AUTH_KEYS:-}"
      SERVICE_RETRY_MAX_ATTEMPTS: "${SERVICE_RETRY_MAX_ATTEMPTS:-2}"
      SERVICE_RETRY_BASE_DELAY_MS: "${SERVICE_RETRY_BASE_DELAY_MS:-50}"
      SERVICE_RETRY_MAX_DELAY_MS: "${SERVICE_RETRY_MAX_DELAY_MS:-500}"
      SERVICE_RETRY_BUDGET_RATIO: "${SERVICE_RETRY_BUDGET_RATIO:-0.1}"
      SERVICE_BREAKER_THRESHOLD: "${SERVICE_BREAKER_THRESHOLD:-3}"
      SERVICE_BREAKER_RECOVERY_TIMEOUT_SECONDS: "${SERVICE_BREAKER_RECOVERY_TIMEOUT_SECONDS:-30}"
      INTERNAL_SERVICE_RATE_LIMITS: "${INTERNAL_SERVICE_RATE_LIMITS:-knowledge-service=100:100,agent-runtime=50:50,agent-capability-worker=50:50}"
      SERVICE_STREAMING_MAX_CONNECTIONS: "${SERVICE_STREAMING_MAX_CONNECTIONS:-16}"
      ADMISSION_TENANT_SHARE_RATIO: "${ADMISSION_TENANT_SHARE_RATIO:-0.2}"
      ADAPTIVE_LOAD_SHEDDING_WINDOW_SECONDS: "${ADAPTIVE_LOAD_SHEDDING_WINDOW_SECONDS:-30}"
      ADAPTIVE_LOAD_SHEDDING_LOW_THRESHOLD_MS: "${ADAPTIVE_LOAD_SHEDDING_LOW_THRESHOLD_MS:-5000}"
      ADAPTIVE_LOAD_SHEDDING_NORMAL_THRESHOLD_MS: "${ADAPTIVE_LOAD_SHEDDING_NORMAL_THRESHOLD_MS:-10000}"
      ADAPTIVE_LOAD_SHEDDING_HIGH_THRESHOLD_MS: "${ADAPTIVE_LOAD_SHEDDING_HIGH_THRESHOLD_MS:-20000}"
      # Compose is a multi-process runtime, so idempotency must be shared.
      # The in-memory backend remains available only to explicit local/test
      # process launches outside this stack.
      INTERNAL_IDEMPOTENCY_BACKEND: "redis"
      INTERNAL_IDEMPOTENCY_TTL_SECONDS: "${INTERNAL_IDEMPOTENCY_TTL_SECONDS:-86400}"
      ADAPTER_BULKHEAD_LIMITS: "${ADAPTER_BULKHEAD_LIMITS:-langgraph:8,openai:16,comfyui:4}"

      # Object Storage (S3/OSS)
      GATEWAY_STORAGE__BACKEND: "${GATEWAY_STORAGE__BACKEND:-local}"
      GATEWAY_STORAGE__LOCAL_BASE_PATH: "${GATEWAY_STORAGE__LOCAL_BASE_PATH:-/app/data/images}"
      GATEWAY_STORAGE__S3__BUCKET: "${GATEWAY_STORAGE__S3__BUCKET:-${S3_BUCKET:-}}"
      GATEWAY_STORAGE__S3__REGION: "${GATEWAY_STORAGE__S3__REGION:-us-east-1}"
      GATEWAY_STORAGE__S3__ACCESS_KEY: "${GATEWAY_STORAGE__S3__ACCESS_KEY:-}"
      GATEWAY_STORAGE__S3__SECRET_KEY: "${GATEWAY_STORAGE__S3__SECRET_KEY:-}"
      GATEWAY_STORAGE__S3__ENDPOINT_URL: "${GATEWAY_STORAGE__S3__ENDPOINT_URL:-}"
      GATEWAY_STORAGE__URL_EXPIRY_SECONDS: "${GATEWAY_STORAGE__URL_EXPIRY_SECONDS:-3600}"
      GATEWAY_STORAGE__KEY_PREFIX: "${GATEWAY_STORAGE__KEY_PREFIX:-dev}"

      # File Upload Limits
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-50}"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - gateway-logs:/app/logs
      - gateway-data:/app/data
      - assistant-memory-data:/app/agent-memory
      - "${AI_PLATFORM_COMPATIBILITY_MANIFEST_PATH:-./deploy/release/compatibility-manifest.json}:/app/deploy/release/compatibility-manifest.json:ro"
    networks:
      - ai-gateway-net
    depends_on:
      gateway-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      agent-capability-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: "${GATEWAY_MEMORY_LIMIT:-384m}"
    init: true

  # AI Gateway Frontend (Web Console)
  frontend:
    image: "${FRONTEND_IMAGE:-ghcr.io/misaya-yang/ai-gateway-web:2.0.0}"
    container_name: ai-gateway-frontend
    environment:
      VITE_API_URL: "${VITE_API_URL:-}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
      VITE_AUTH_EMAIL_DOMAIN: "${VITE_AUTH_EMAIL_DOMAIN:-${AUTH_ALLOWED_EMAIL_DOMAIN:-example.com}}"
      VITE_SUPPORT_EMAIL: "${VITE_SUPPORT_EMAIL:-admin@${AUTH_ALLOWED_EMAIL_DOMAIN:-example.com}}"
      VITE_TELEMETRY_ENDPOINT: "${VITE_TELEMETRY_ENDPOINT:-}"
      VITE_SSE_DEBUG: "${VITE_SSE_DEBUG:-}"
      VITE_AGENT_STUDIO_ENABLED: "${VITE_AGENT_STUDIO_ENABLED:-true}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    networks:
      - ai-gateway-net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: "${FRONTEND_MEMORY_LIMIT:-96m}"

  # ===========================================================================
  # Microservices
  # ===========================================================================

  # Knowledge Base Service (KB CRUD + Retrieval)
  knowledge-service:
    image: "${KNOWLEDGE_IMAGE:-ghcr.io/misaya-yang/ai-gateway-knowledge-service:2.0.0}"
    container_name: ai-gateway-knowledge-service
    environment: &knowledge-service-environment
      <<: *container-proxy-env
      KNOWLEDGE_RUNTIME_ROLE: "api"
      KNOWLEDGE_QDRANT_INTERACTIVE_DEADLINE_SECONDS: "${KNOWLEDGE_QDRANT_INTERACTIVE_DEADLINE_SECONDS:-3}"
      KNOWLEDGE_CORS__ALLOW_ORIGINS: '${KNOWLEDGE_CORS_ALLOW_ORIGINS_JSON:-["http://localhost:80","http://localhost:3000","http://localhost:8081"]}'
      KNOWLEDGE_APP__HOST: "0.0.0.0"
      KNOWLEDGE_APP__PORT: "8092"
      # Guard-documented dev escape valve: the startup check refuses to boot
      # with neither the internal token nor anonymity. Default false keeps it
      # fail-closed; see apps/knowledge-service main.py Phase K5c.
      KNOWLEDGE_APP__ALLOW_ANONYMOUS: "${KNOWLEDGE_APP__ALLOW_ANONYMOUS:-false}"
      ENVIRONMENT: "${ENVIRONMENT:-}"
      KNOWLEDGE_DATABASE__DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}?options=-csearch_path%3Dknowledge%2Cgateway%2Cassistant%2Cpublic"
      KNOWLEDGE_REDIS__ENABLED: "true"
      KNOWLEDGE_REDIS__URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2"
      KNOWLEDGE_QDRANT__URL: "http://qdrant:6333"
      KNOWLEDGE_QDRANT__BM25_V2_ENABLED: "${KB_BM25_V2_ENABLED:-false}"
      KNOWLEDGE_QDRANT__BM25_V2_CAPABILITY_TTL_SECONDS: "${KB_BM25_V2_CAPABILITY_TTL_SECONDS:-300}"
      KNOWLEDGE_QDRANT__BM25_V2_READINESS_TTL_SECONDS: "${KB_BM25_V2_READINESS_TTL_SECONDS:-5}"
      KNOWLEDGE_QDRANT__BM25_V2_CUTOVER_TEST_TENANTS: "${KB_BM25_V2_CUTOVER_TEST_TENANTS:-}"
      KNOWLEDGE_EMBEDDINGS__PROVIDER: "${KB_EMBEDDING_PROVIDER:-dashscope}"
      KNOWLEDGE_EMBEDDINGS__API_KEY: "${KB_EMBEDDING_API_KEY:-}"
      KNOWLEDGE_EMBEDDINGS__GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      KNOWLEDGE_EMBEDDINGS__DASHSCOPE_API_KEY: "${DASHSCOPE_EMBEDDING_API_KEY:-${DASHSCOPE_API_KEY:-}}"
      KNOWLEDGE_EMBEDDINGS__SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY:-}"
      # Self-hosted OpenAI-compatible embedding server (vLLM / TEI), e.g.
      # Qwen3-Embedding; consulted when KB_EMBEDDING_PROVIDER=openai_compatible.
      KNOWLEDGE_EMBEDDINGS__OPENAI_COMPATIBLE_API_KEY: "${KB_EMBEDDING_OPENAI_COMPATIBLE_API_KEY:-}"
      KNOWLEDGE_EMBEDDINGS__OPENAI_COMPATIBLE_BASE_URL: "${KB_EMBEDDING_OPENAI_COMPATIBLE_BASE_URL:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_OCR_API_KEY: "${DASHSCOPE_OCR_API_KEY:-}"
      DASHSCOPE_CHAT_API_KEY: "${DASHSCOPE_CHAT_API_KEY:-}"
      DASHSCOPE_IMAGE_API_KEY: "${DASHSCOPE_IMAGE_API_KEY:-}"
      DASHSCOPE_EMBEDDING_API_KEY: "${DASHSCOPE_EMBEDDING_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      DASHSCOPE_OCR_BASE_URL: "${DASHSCOPE_OCR_BASE_URL:-}"
      DASHSCOPE_CHAT_BASE_URL: "${DASHSCOPE_CHAT_BASE_URL:-}"
      DASHSCOPE_CHAT_WIRE_PROTOCOL: "${DASHSCOPE_CHAT_WIRE_PROTOCOL:-responses_v1}"
      DASHSCOPE_EMBEDDING_BASE_URL: "${DASHSCOPE_EMBEDDING_BASE_URL:-}"
      DASHSCOPE_IMAGE_BASE_URL: "${DASHSCOPE_IMAGE_BASE_URL:-}"
      DASHSCOPE_RERANK_BASE_URL: "${DASHSCOPE_RERANK_BASE_URL:-}"
      DASHSCOPE_RERANK_REQUEST_SCHEMA: "${DASHSCOPE_RERANK_REQUEST_SCHEMA:-auto}"
      DASHSCOPE_RERANK_INSTRUCT: "${DASHSCOPE_RERANK_INSTRUCT:-}"
      KNOWLEDGE_EMBEDDINGS__MODEL: "${KB_EMBEDDING_MODEL:-text-embedding-v4}"
      KNOWLEDGE_EMBEDDINGS__DIMENSION: "${KB_EMBEDDING_DIMENSION:-1024}"
      # Internal RAGAS judges use server-owned credentials/endpoints. Callers
      # may select only providers/models in these explicit allowlists.
      KNOWLEDGE_RAGAS_EVAL__PROVIDER: "${KB_RAGAS_JUDGE_PROVIDER:-dashscope}"
      KNOWLEDGE_RAGAS_EVAL__MODEL: "${KB_RAGAS_JUDGE_MODEL:-qwen3.7-plus}"
      KNOWLEDGE_RAGAS_EVAL__BASE_URL: "${KB_RAGAS_JUDGE_BASE_URL:-}"
      KNOWLEDGE_RAGAS_EVAL__ALLOWED_PROVIDERS: '${KB_RAGAS_ALLOWED_PROVIDERS_JSON:-["dashscope"]}'
      KNOWLEDGE_RAGAS_EVAL__ALLOWED_MODELS: '${KB_RAGAS_ALLOWED_MODELS_JSON:-["qwen3.7-plus"]}'
      KNOWLEDGE_RAGAS_EVAL__TIMEOUT_SECONDS: "${KB_RAGAS_JUDGE_TIMEOUT_SECONDS:-60}"
      KNOWLEDGE_RAGAS_EVAL__REQUEST_TIMEOUT_SECONDS: "${KB_RAGAS_REQUEST_TIMEOUT_SECONDS:-180}"
      KNOWLEDGE_PROCESSING__WORKER_CONCURRENCY: "${GATEWAY_KNOWLEDGE__WORKER_CONCURRENCY:-1}"
      # Upload / PDF-split limits. The settings fields read these BARE names
      # (validation_alias, no KNOWLEDGE_ prefix); without forwarding here the
      # .env.example knobs would be inert inside the container.
      KB_MAX_FILE_SIZE_MB: "${KB_MAX_FILE_SIZE_MB:-16}"
      KB_MAX_BATCH_SIZE_MB: "${KB_MAX_BATCH_SIZE_MB:-32}"
      KB_PDF_SPLIT_MAX_SIZE_MB: "${KB_PDF_SPLIT_MAX_SIZE_MB:-20}"
      KB_PDF_SPLIT_PAGES_PER_PART: "${KB_PDF_SPLIT_PAGES_PER_PART:-500}"
      KB_PDF_MAX_PAGES: "${KB_PDF_MAX_PAGES:-2000}"
      KB_PDF_SPLIT_MAX_OUTPUT_BYTES: "${KB_PDF_SPLIT_MAX_OUTPUT_BYTES:-100663296}"
      # Storage (S3)
      KNOWLEDGE_STORAGE__BACKEND: "${GATEWAY_STORAGE__BACKEND:-local}"
      KNOWLEDGE_STORAGE__LOCAL_BASE_PATH: "${KNOWLEDGE_STORAGE__LOCAL_BASE_PATH:-/app/data/files}"
      KNOWLEDGE_STORAGE__S3__BUCKET: "${KNOWLEDGE_STORAGE__S3__BUCKET:-${GATEWAY_STORAGE__S3__BUCKET:-${S3_BUCKET:-}}}"
      KNOWLEDGE_STORAGE__S3__REGION: "${GATEWAY_STORAGE__S3__REGION:-ap-southeast-2}"
      KNOWLEDGE_STORAGE__S3__ACCESS_KEY: "${GATEWAY_STORAGE__S3__ACCESS_KEY:-}"
      KNOWLEDGE_STORAGE__S3__SECRET_KEY: "${GATEWAY_STORAGE__S3__SECRET_KEY:-}"
      KNOWLEDGE_STORAGE__S3__ENDPOINT_URL: "${GATEWAY_STORAGE__S3__ENDPOINT_URL:-}"
      KNOWLEDGE_STORAGE__KEY_PREFIX: "${GATEWAY_STORAGE__KEY_PREFIX:-dev}"
      KNOWLEDGE_STORAGE__SIGNING_KEY: "${GATEWAY_ENCRYPTION_KEY:?GATEWAY_ENCRYPTION_KEY is required for local image URL signing}"
      AI_PLATFORM_INTERNAL_TOKEN: "${AI_PLATFORM_INTERNAL_TOKEN:?AI_PLATFORM_INTERNAL_TOKEN is required}"
      AI_PLATFORM_CAPABILITY_PROOF_SECRET: "${AI_PLATFORM_CAPABILITY_PROOF_SECRET:?AI_PLATFORM_CAPABILITY_PROOF_SECRET is required}"
      AI_PLATFORM_COMPATIBILITY_MANIFEST_PATH: "/app/deploy/release/compatibility-manifest.json"
      AI_PLATFORM_RELEASE_ID: "${AI_PLATFORM_RELEASE_ID:-}"
      AI_PLATFORM_GIT_SHA: "${VCS_REF:-}"
      AI_PLATFORM_IMAGE_DIGEST: "${KNOWLEDGE_IMAGE_DIGEST:-}"
      # Phase K5c: gateway HMAC verification (Polaris #6-KB). Same secret as
      GATEWAY_ENCRYPTION_KEY: "${GATEWAY_ENCRYPTION_KEY:?GATEWAY_ENCRYPTION_KEY is required}"
      INTERNAL_COMM_STATE_BACKEND: "${INTERNAL_COMM_STATE_BACKEND:-redis}"
      INTERNAL_COMM_REDIS_URL: "${INTERNAL_COMM_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/3}"
      INTERNAL_AUTH_VERSION: "${INTERNAL_AUTH_VERSION:-v2}"
      INTERNAL_AUTH_ACTIVE_KEY_ID: "${INTERNAL_AUTH_ACTIVE_KEY_ID:-local}"
      INTERNAL_AUTH_KEYS: "${INTERNAL_AUTH_KEYS:-}"
      SERVICE_RETRY_MAX_ATTEMPTS: "${SERVICE_RETRY_MAX_ATTEMPTS:-2}"
      SERVICE_RETRY_BASE_DELAY_MS: "${SERVICE_RETRY_BASE_DELAY_MS:-50}"
      SERVICE_RETRY_MAX_DELAY_MS: "${SERVICE_RETRY_MAX_DELAY_MS:-500}"
      SERVICE_RETRY_BUDGET_RATIO: "${SERVICE_RETRY_BUDGET_RATIO:-0.1}"
      SERVICE_BREAKER_THRESHOLD: "${SERVICE_BREAKER_THRESHOLD:-3}"
      SERVICE_BREAKER_RECOVERY_TIMEOUT_SECONDS: "${SERVICE_BREAKER_RECOVERY_TIMEOUT_SECONDS:-30}"
      INTERNAL_SERVICE_RATE_LIMITS: "${INTERNAL_SERVICE_RATE_LIMITS:-knowledge-service=100:100,agent-runtime=50:50,agent-capability-worker=50:50}"
      SERVICE_STREAMING_MAX_CONNECTIONS: "${SERVICE_STREAMING_MAX_CONNECTIONS:-16}"
      INTERNAL_IDEMPOTENCY_BACKEND: "redis"
      INTERNAL_IDEMPOTENCY_TTL_SECONDS: "${INTERNAL_IDEMPOTENCY_TTL_SECONDS:-86400}"
    command: ["python", "-m", "uvicorn", "knowledge_service.main:app", "--host", "0.0.0.0", "--port", "8092", "--workers", "1"]
    volumes:
      - kb-data:/app/data
      - "${AI_PLATFORM_COMPATIBILITY_MANIFEST_PATH:-./deploy/release/compatibility-manifest.json}:/app/deploy/release/compatibility-manifest.json:ro"
    ports:
      - "127.0.0.1:${KNOWLEDGE_SERVICE_PORT:-8092}:8092"
    networks:
      - ai-gateway-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_MEMORY_LIMIT:-512m}"
    init: true

  # Knowledge durable ingestion worker. It shares the API image and database,
  # exposes health only, and discovers queued generations from PostgreSQL.
  knowledge-worker:
    image: "${KNOWLEDGE_IMAGE:-ghcr.io/misaya-yang/ai-gateway-knowledge-service:2.0.0}"
    environment:
      <<: *knowledge-service-environment
      KNOWLEDGE_RUNTIME_ROLE: "worker"
    command: ["python", "-m", "uvicorn", "knowledge_service.main:app", "--host", "0.0.0.0", "--port", "8092", "--workers", "1"]
    volumes:
      - kb-data:/app/data
      - "${AI_PLATFORM_COMPATIBILITY_MANIFEST_PATH:-./deploy/release/compatibility-manifest.json}:/app/deploy/release/compatibility-manifest.json:ro"
    networks:
      - ai-gateway-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_WORKER_MEMORY_LIMIT:-512m}"
    init: true

  # Rust capability worker. It owns durable tool execution but never a model loop.
  agent-capability-worker:
    image: "${AGENT_CAPABILITY_WORKER_IMAGE:-ai-gateway-agent-capability-worker:local-94cbbddafc17-46158add036c}"
    expose:
      - "8095"
    environment:
      <<: *container-proxy-env
      AI_PLATFORM_INTERNAL_TOKEN: "${AI_PLATFORM_INTERNAL_TOKEN:?AI_PLATFORM_INTERNAL_TOKEN is required}"
      AI_PLATFORM_CAPABILITY_PROOF_SECRET: "${AI_PLATFORM_CAPABILITY_PROOF_SECRET:?AI_PLATFORM_CAPABILITY_PROOF_SECRET is required}"
      AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET: "${AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET:?AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET is required}"
      AI_PLATFORM_CAPABILITY_WORKER_BIND: "0.0.0.0:8095"
      AI_PLATFORM_CAPABILITY_WORKER_FIXTURES_ENABLED: "${AI_PLATFORM_CAPABILITY_WORKER_FIXTURES_ENABLED:-false}"
      AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED: "${AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED:-true}"
      AI_PLATFORM_OFFICE_FONT_PATHS: "${AI_PLATFORM_OFFICE_FONT_PATHS:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}"
      AI_PLATFORM_KNOWLEDGE_SERVICE_URL: "${AI_PLATFORM_KNOWLEDGE_SERVICE_URL:-http://knowledge-service:8092}"
      AI_PLATFORM_GATEWAY_INTERNAL_URL: "${AI_PLATFORM_GATEWAY_INTERNAL_URL:-http://gateway:8080}"
      AI_PLATFORM_CAPABILITY_WORKSPACE_ROOT: "/workspace"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-gateway}"
      AI_PLATFORM_CAPABILITY_WORKER_DB_POOL_MAX_SIZE: "${AI_PLATFORM_CAPABILITY_WORKER_DB_POOL_MAX_SIZE:-4}"
    volumes:
      - agent-capability-workspaces:/workspace
    networks:
      - ai-gateway-net
    depends_on:
      gateway-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      knowledge-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ai-platform-capability-worker-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: "${AGENT_CAPABILITY_WORKER_MEMORY_LIMIT:-1g}"
    cpus: "${AGENT_CAPABILITY_WORKER_CPUS:-1.0}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    init: true

  # Rust Agent Runtime. It is the sole Agent kernel for new and resumed turns.
  agent-runtime:
    container_name: ai-gateway-agent-runtime
    image: "${AI_PLATFORM_AGENT_RUNTIME_IMAGE:-ai-gateway-agent-runtime:local-94cbbddafc17-46158add036c}"
    expose:
      - "8094"
    environment:
      <<: *container-proxy-env
      AI_PLATFORM_INTERNAL_TOKEN: "${AI_PLATFORM_INTERNAL_TOKEN:?AI_PLATFORM_INTERNAL_TOKEN is required}"
      AI_PLATFORM_CAPABILITY_PLANE_URL: "${AI_PLATFORM_CAPABILITY_PLANE_URL:-http://gateway:8080/internal/v2/agent-capabilities}"
      AI_PLATFORM_CAPABILITY_WORKER_URL: "${AI_PLATFORM_CAPABILITY_WORKER_URL:-http://agent-capability-worker:8095}"
      AI_PLATFORM_CAPABILITY_WORKER_ENABLED: "${AI_PLATFORM_CAPABILITY_WORKER_ENABLED:-true}"
      AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED: "${AI_PLATFORM_CAPABILITY_WORKER_WRITES_ENABLED:-true}"
      AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET: "${AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET:?AI_PLATFORM_CAPABILITY_LEASE_SIGNING_SECRET is required}"
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN: "${AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_INTERNAL_TOKEN:-}"
      AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_RUNTIME_BASE_URL: "${AI_PLATFORM_AGENT_RUNTIME_MODEL_PLANE_RUNTIME_BASE_URL:-http://gateway:8080/internal/v1/agent-model-plane}"
      AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION: "${AI_PLATFORM_AGENT_RUNTIME_KERNEL_REVISION:-}"
      AI_PLATFORM_RUNTIME_BIND: "0.0.0.0:8094"
      AI_PLATFORM_RUNTIME_WORKDIR: "/workspace"
      AI_PLATFORM_AGENT_HOME: "/var/lib/ai-platform-agent-runtime/runtime-home"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-gateway}"
      AI_PLATFORM_RUNTIME_DB_POOL_MAX_SIZE: "${AI_PLATFORM_AGENT_RUNTIME_DB_POOL_MAX_SIZE:-10}"
      AI_PLATFORM_RUNTIME_CHANNEL_CAPACITY: "${AI_PLATFORM_AGENT_RUNTIME_CHANNEL_CAPACITY:-256}"
    volumes:
      - agent-runtime-home:/var/lib/ai-platform-agent-runtime/runtime-home
    networks:
      - ai-gateway-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-capability-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: "${AI_PLATFORM_AGENT_RUNTIME_MEMORY_LIMIT:-192m}"
    init: true

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-gateway-net:
    driver: bridge
    name: ai-gateway-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pg-data: {}
  redis-data: {}
  qdrant-data: {}
  gateway-logs: {}
  gateway-data: {}
  assistant-memory-data: {}
  agent-runtime-home: {}
  agent-capability-workspaces: {}
  kb-data: {}
  tempo-data: {}
