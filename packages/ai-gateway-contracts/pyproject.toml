[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway-contracts"
version = "0.1.0"
description = "I/O-free cross-service protocol contracts: Pydantic/dataclass models, schema-version constants, pure validation and signed-payload specifications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Gateway Maintainers" }]
# PRD §ARC-04 goal 2: contracts may only use protocol-model dependencies.
# No database, Redis, HTTP client, FastAPI, provider SDK or service-config
# dependencies are allowed here; scripts/core_boundary/check_core_boundary.py
# enforces this mechanically.
dependencies = [
    "pydantic>=2.12.0",  # event_envelope.py payload/envelope models
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway_contracts"]
