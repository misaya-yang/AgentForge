[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway-core"
version = "0.1.1"
description = "Shared primitives (logging, exceptions, enums, protocols, proxy framework) consumed by the Gateway and Knowledge services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Gateway Maintainers" }]
# Runtime deps the package itself imports. The package owns concretes
# (DatabaseStorage, S3 storage, skill parser, usage recorder) and declares
# their dependencies directly so standalone installations remain complete.
dependencies = [
    # I/O-free protocol contracts (workspace member, PRD §ARC-04). Core
    # re-exports the migrated protocol modules as compatibility shims.
    "ai-gateway-contracts",
    "httpx>=0.28.0",
    "fastapi>=0.124.0",
    "starlette>=0.50.0",
    "PyYAML>=6.0",          # ai_gateway_core.skills.parser
    "asyncpg>=0.29",        # ai_gateway_core.persistence.database
    "aioboto3>=12",         # ai_gateway_core.storage.image/artifact/file (S3)
    "aiofiles>=23",         # ai_gateway_core.storage.file_storage
    "numpy>=1.26",          # ai_gateway_core.metrics.usage_recorder (sketch)
    "oss2>=2.18",           # ai_gateway_core.storage (alibaba OSS backend)
    "Pillow>=10",           # ai_gateway_core.storage.image_storage
    "redis>=5.0",           # ai_gateway_core.events (Redis Streams + asyncio client)
    "cryptography>=44.0",   # shared provider-secret encryption/decryption
    # OpenTelemetry distributed tracing — gateway/AS/KS share these
    # exporters & instrumentors. ai_gateway_core.tracing wires them into
    # FastAPI lifespan + the httpx ServiceProxy. Audit P1-1 (slow chat
    # diagnosis) needs span-level breakdown across the 4 hops.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
]

[project.optional-dependencies]
# Dev / test extras — fakeredis backs the ai_gateway_core.events test suite
# (in-memory Redis Streams emulation, no broker required).
dev = [
    "fakeredis>=2.20",
]

[tool.uv.sources]
ai-gateway-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway_core"]
