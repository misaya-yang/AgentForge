[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway"
version = "2.0.0"
description = "AI Service Gateway - 统一 AI 服务网关，支持多协议适配、限流、熔断、会话管理等功能"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AI Gateway Team" }
]
keywords = ["ai", "gateway", "fastapi", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.124.0",
    "uvicorn>=0.38.0",
    "starlette>=0.50.0",
    "scalar-fastapi>=1.8.2",

    # Data Validation & Settings
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",

    # HTTP Client
    "httpx>=0.28.0",

    # Caching
    "cachetools>=5.5.0",

    # Configuration & Serialization
    "PyYAML>=6.0.3",
    "jsonschema>=4.25.0",
    "orjson>=3.11.0",

    # Authentication
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.1.0",

    # WebSocket & SSE
    "websockets>=15.0.0",
    "sse-starlette>=3.0.0",

    # JSON Path
    "jsonpath-ng>=1.7.0",

    # File Upload
    "python-multipart>=0.0.21",

    # Environment
    "python-dotenv>=1.2.0",

    # LangGraph SDK
    "langgraph-sdk>=0.2.15",

    # Token Counting (for LLM context management)
    "tiktoken>=0.7.0",

    # Shared primitives (workspace member — see packages/ai-gateway-core/)
    "ai-gateway-core",
    # I/O-free cross-service protocol contracts (workspace member — see
    # packages/ai-gateway-contracts/, PRD §ARC-04)
    "ai-gateway-contracts",
]

[tool.uv.workspace]
members = [
    "packages/ai-gateway-contracts",
    "packages/ai-gateway-core",
    "apps/knowledge-service",
    "sdk/python",
]

[tool.uv.sources]
ai-gateway-contracts = { workspace = true }
ai-gateway-core = { workspace = true }

[project.optional-dependencies]
# Database & Cache
database = [
    "asyncpg>=0.31.0",
    "redis>=7.1.0",
]

# Knowledge Base (KBMS)
knowledge = [
    "qdrant-client>=1.16.0",
    "dashscope>=1.25.0",
]

# Document Loaders & Generators
documents = [
    "pypdf>=6.1.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.25.0",  # PDF to image conversion for vision models
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",  # PowerPoint generation
    "beautifulsoup4>=4.12.3",
    "lxml>=6.0.0",
]

# gRPC Support
grpc = [
    "grpcio>=1.76.0",
    "protobuf>=6.33.0",
]

# Async HTTP (for adapters)
aiohttp = [
    "aiohttp>=3.13.0",
]

# Cloud Storage (S3, OSS)
storage = [
    "aioboto3>=14.0.0",   # AWS S3 async client
    "oss2>=2.18.0",       # Alibaba Cloud OSS client
    "aiofiles>=24.0.0",   # Async file I/O for streaming downloads
]

# Code Execution Sandbox (Docker SDK for gVisor/runsc)
sandbox = [
    "docker>=7.0.0",
]

# All optional dependencies
all = [
    "ai-gateway[database,knowledge,documents,grpc,aiohttp,storage,sandbox]",
]

# Development dependencies
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.32.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

# Testing only
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.32.0",
    "respx>=0.22.0",  # httpx mock transport (confluence tool tests)
]

[project.urls]
Homepage = "https://github.com/misaya-yang/AI--Platfform"
Documentation = "https://github.com/misaya-yang/AI--Platfform#readme"
Repository = "https://github.com/misaya-yang/AI--Platfform"
Issues = "https://github.com/misaya-yang/AI--Platfform/issues"

[project.scripts]
ai-gateway = "src.main:app"
ai-gateway-db = "database.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"database" = "database"
"rust/agent-runtime-overlay/kernel-rs/ai-platform-capability-worker/src/platform_catalog_v1.json" = "src/core/data/platform_catalog_v1.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/database",
    "/tests",
    "/rust/agent-runtime-overlay/kernel-rs/ai-platform-capability-worker/src/platform_catalog_v1.json",
    "/README.md",
    "/pyproject.toml",
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Evaluation fixtures under tests/fixtures/eval/ are sample repositories fed to
# the agent as task input. They ship their own tests/ directories, which pytest
# would otherwise collect as project tests and fail on their unresolvable
# imports (e.g. `No module named 'settlement'`). They are data, not our suite.
norecursedirs = ["tests/fixtures/eval/*/*/repository"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=25",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: live integration or end-to-end tests",
]

# Ruff configuration (replaces black, isort, flake8)
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "ARG001", # unused function argument
]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "scripts/",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
