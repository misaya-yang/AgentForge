# Included only by explicit /assets MIME locations. Never serve a compressed
# fallback with the wrong encoding, and never expose source maps as assets.
set $asset_suffix $negotiated_asset_suffix;
set $asset_encoding $negotiated_asset_encoding;
if (!-f $request_filename$asset_suffix) {
    set $asset_suffix "";
    set $asset_encoding "";
}
gzip off;
expires 1y;
add_header Cache-Control "public, immutable";
add_header Vary "Accept-Encoding" always;
add_header Content-Encoding $asset_encoding;
include /tmp/frontend-security-headers.conf;
try_files $uri$asset_suffix $uri =404;
