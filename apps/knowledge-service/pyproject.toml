[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-service"
version = "0.1.0"
description = "Knowledge Base Microservice - Independent KB service extracted from AI Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Gateway Maintainers" }]
dependencies = [
    "fastapi>=0.124.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.0",
    "asyncpg>=0.31.0",
    "qdrant-client>=1.16.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.21",
    "pymupdf>=1.25.0",
    "pypdf>=6.1.0",
    # Runtime document parsers imported by worker.py / document_processor.py /
    # document_image_extractor.py. Undeclared before the 2026-08 KB upgrade,
    # which made DOCX/HTML ingestion ImportError inside the container image.
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=6.0.0",
    "boto3>=1.38.0",
    "aioboto3>=14.0.0",
    "structlog>=25.1.0",
    "orjson>=3.11.0",
    "python-dotenv>=1.2.0",
    "bcrypt>=4.2.0",
    "cachetools>=5.5.0",
    "dashscope>=1.25.0",
    "google-genai>=1.0.0",
    "ai-gateway-contracts",
    "ai-gateway-core",
    # sentence-transformers / paddleocr removed — embeddings use remote Gemini API,
    # OCR uses VLM service. Avoids pulling PyTorch (~2GB) into the image.
]

[tool.uv.sources]
ai-gateway-contracts = { workspace = true }
ai-gateway-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

# Image-only tooling is exact-pinned in uv.lock and exported separately from
# runtime dependencies. The Docker build uses these versions before compiling
# the few transitive source distributions that do not publish Linux wheels.
[dependency-groups]
image-build = [
    "hatchling==1.27.0",
    "pip==25.1.1",
    "setuptools==80.9.0",
    "wheel==0.45.1",
]

[project.scripts]
knowledge-service = "knowledge_service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
