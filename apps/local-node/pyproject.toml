[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-platform-local-node"
version = "0.1.0"
description = "Fail-closed local capability broker for AI--Platfform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
local-node = "local_node.cli:main"

[project.optional-dependencies]
test = ["pytest>=9.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/local_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--tb=short"]

[tool.ruff]
line-length = 100
target-version = "py311"
