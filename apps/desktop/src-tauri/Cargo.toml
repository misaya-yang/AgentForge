[package]
name = "agentforge-desktop-shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# Deliberately isolated until the client owner resolves/pins the Tauri dependency
# graph and commits a reviewed lockfile. Existing native workspace is untouched.
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
url = "2"
base64 = "0.22"
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
ai-platform-client = { path = "../../../rust/platform-native/crates/platform-client" }
ai-platform-local-node = { path = "../../../rust/platform-native/crates/platform-local-node" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
ring = "0.17"
semver = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
